<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Text size (About, on a phone): the page is laid out narrower and shown bigger, everything at once. Set here, before
   anything is drawn; applyZoom() does the same when it's changed. */
const ZOOM = { normal: 1, large: 1.15, larger: 1.3 };
/* iPhone and iPad Safari zoom in on a search box whose text is under 16 px when it's tapped, and stay zoomed (the
   page looks shifted): there the scale is capped at the chosen one, which stops that zoom; pinch zoom still works,
   Safari ignores the cap for the user's own zoom. Android doesn't zoom on a tap, so nothing changes there. */
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function viewportFor(z) {
  let k = ZOOM[z] || 1;
  if (!matchMedia("(pointer: coarse)").matches) k = 1;
  return (k === 1 ? "width=device-width, initial-scale=1" : `width=${Math.round(screen.width / k)}, initial-scale=${k}`)
    + (IOS ? `, maximum-scale=${k}` : "") + ", viewport-fit=cover";
}
let zoom0 = null;
try { zoom0 = JSON.parse(localStorage.getItem("bf.zoom")); } catch (e) {}
try { document.querySelector("meta[name=viewport]").content = viewportFor(zoom0); } catch (e) {}
</script>
<title>BF Companion</title>
<meta name="description" content="A guide to Brave Frontier Revived: every unit's stats, skills and SP builds, where to get units, spheres and items, Elgifs, quest drops and a team builder.">
<meta name="theme-color" content="#161922">
<!-- the website: its tab icon, and a phone's "Add to Home screen" -->
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="BF Companion">
<style>
/* The phone app: a guide to every Brave Frontier unit, styled after the game (its textures and font in /static).
   Data: /data/units.json, details.json, items.json, drops.json and /data/w/<id>.json (from the wiki). */
@font-face { font-family: Rodin; src: url(/static/rodin.woff2) format("woff2"); font-display: swap; }
:root {
  --bg: #0b0a14; --card: #141a2e; --card2: #1b2340; --line: #2a3350; --text: #fff; --dim: #c9c3b2; --accent: #ffd45c; --warn: #ff9a3c;
  --gold: #e9c868; --gold2: #b8902f; --gold3: #5a3f12; --orange: #f7a21b; --blue: #3f8cff;
  --Fire: #ff6a47; --Water: #49a4ff; --Earth: #5fc56c; --Thunder: #ffd24a; --Light: #f2ecd8; --Dark: #b382ff;
  --ol: 0 0 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 3px rgba(0,0,0,.7);
  --steel: url(/static/iphx_footer.png); --navh: 78px; --toph: 57px;  /* the header's height, for the bars that stick under it */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { color-scheme: dark; }
body { margin: 0; color: var(--text); font: 14px/1.45 Arial, "Segoe UI", sans-serif; background: var(--bg); overscroll-behavior-y: none; overflow-x: clip; }
/* the backdrop on its own fixed layer: a "fixed" page background makes a phone repaint the whole page while scrolling */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; transform: translateZ(0);
  background: linear-gradient(rgba(6,4,16,.5), rgba(6,4,16,.75)), var(--bg) url(/static/base.jpg) center top / cover; }
.r, h1, h2, h3, .tag, .chip, .nav button, .badge, .st, .gname, .pill, .tbl th, .tbl td, .tabs2 button, select { font-family: Rodin, "Arial Black", Arial, sans-serif; }
.ol { text-shadow: var(--ol); }
button, select, input { font: inherit; color: var(--text); }
input, select { background: linear-gradient(#0a1020, #121a36); border: 2px solid var(--gold2); border-radius: 10px; padding: 8px 12px; box-shadow: inset 0 0 0 1px #000, inset 0 2px 10px rgba(0,0,0,.7); }
input:focus, select:focus { outline: none; border-color: var(--accent); }
/* a search box's × (the same on iPhone and Android; the browser's own is hidden): shows once something is typed */
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
.qwrap { position: relative; display: flex; flex: 1; min-width: 0; } .qwrap > input { flex: 1; min-width: 0; } .qwrap.has > input { padding-right: 38px; }  /* room for the × only once it shows: the hint keeps its room */
.qx { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.14); color: var(--text); font-size: 15px; line-height: 30px; text-align: center; display: none; cursor: pointer; }
.qwrap.has .qx { display: block; } .qx:active { background: rgba(255,255,255,.3); }
/* a long note (over 5 lines) shows its first 3 and a button that opens or closes the rest */
p.fold { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.foldbtn { display: inline-flex; align-items: center; gap: 4px; margin: 2px 0 0; padding: 6px 2px; background: none; border: 0; color: var(--accent); font: bold 12.5px Arial, sans-serif; text-shadow: var(--ol); cursor: pointer; }
.foldbtn:active { opacity: .7; }
select { text-shadow: var(--ol); font-size: 13px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top));
  background: var(--steel) center / cover; border-bottom: 3px solid var(--gold); box-shadow: 0 3px 0 var(--gold3), 0 8px 18px rgba(0,0,0,.7); }
.top .crest { height: 42px; filter: drop-shadow(0 2px 3px #000); }
.top h1 { font-size: 19px; margin: 0; text-shadow: var(--ol); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { display: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #6ab0ff, #1a4fd0 60%, #0f2f8a);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 3px #000; font-size: 20px; text-shadow: var(--ol); }
body.sub .top .back { display: grid; place-items: center; } body.sub .top .crest { display: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--gold2); background: linear-gradient(#0a1020, #121a36); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; } .iconbtn.on { border-color: var(--accent); color: var(--accent); }
.iconbtn img { width: 26px; height: 26px; filter: grayscale(1) brightness(.75) drop-shadow(0 1px 1px #000); } .iconbtn.on img { filter: drop-shadow(0 0 4px #ffd76a); }

/* bottom navigation: the game's own footer buttons */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 6px; padding: 5px 8px 4px; padding-bottom: max(4px, env(safe-area-inset-bottom));
  background: var(--steel) center / cover; border-top: 3px solid var(--gold); box-shadow: 0 -3px 0 var(--gold3), 0 -8px 18px rgba(0,0,0,.7); }
.nav button { padding: 0; border: 0; background: none; width: min(68px, calc((100vw - 48px) / 5)); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav button img { width: 100%; height: auto; max-height: 64px; display: block; margin: 0 auto; transition: transform .15s, filter .15s; filter: brightness(.7) saturate(.7) drop-shadow(0 2px 2px #000); }
.nav button.on img { filter: drop-shadow(0 0 5px rgba(255,215,106,.9)) drop-shadow(0 2px 2px #000); transform: translateY(-3px) scale(1.06); }
.nav button:active img { transform: scale(.94); }
.sti { width: 1.2em; height: 1.2em; vertical-align: -.25em; }
main { padding-bottom: calc(var(--navh) + 20px); }
.view { display: none; } .view.on { display: block; }

/* filters */
.bar2 { position: sticky; top: var(--toph); z-index: 10; padding: 8px 12px; background: linear-gradient(rgba(11,10,20,.96), rgba(11,10,20,.86)); border-bottom: 1px solid var(--gold3); }
.searchrow { display: flex; gap: 8px; } .searchrow input { flex: 1; min-width: 0; }
@media (max-width: 340px) { #usort { max-width: 88px; } }  /* a narrow layout (Text size: Larger): room for the search hint */
.scroller { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; } .scroller::-webkit-scrollbar { display: none; }
.scroller.wrap { flex-wrap: wrap; overflow: visible; padding: 10px 12px 0; }  /* every chip on screen: no sideways row that cuts off */
/* a sideways row: a fade on the side where more chips are hidden (phones show no scrollbar), a slim one with a mouse */
.scroller.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); }
.scroller.less { -webkit-mask-image: linear-gradient(to right, transparent, #000 30px); mask-image: linear-gradient(to right, transparent, #000 30px); }
.scroller.less.more { -webkit-mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); }
@media (pointer: fine) { .scroller:not(.wrap) { scrollbar-width: thin; scrollbar-color: var(--gold3) transparent; padding-bottom: 6px; }
  .scroller:not(.wrap)::-webkit-scrollbar { display: block; height: 6px; } .scroller:not(.wrap)::-webkit-scrollbar-thumb { background: var(--gold3); border-radius: 3px; } }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; text-shadow: var(--ol);
  border: 2px solid var(--gold2); background: linear-gradient(#0a1020, #121a36); box-shadow: inset 0 0 0 1px #000; opacity: .55; }
.chip img { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px #000); } .chip .sti { width: 17px; height: 17px; margin-left: -3px; } .chip.on { opacity: 1; border-color: var(--gold); background: linear-gradient(#20305c, #0f1733); }
.fsum { margin-top: 8px; font-size: 12px; color: var(--dim); text-shadow: var(--ol); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .fsum b { color: var(--accent); }
.fbtn { position: relative; flex: none; } .fbtn span { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: #e8531a; font: 11px/18px Rodin, Arial, sans-serif; text-shadow: var(--ol); }
.fbtn span:empty { display: none; }
.ghead { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin: 8px 0 -2px; padding: 0 2px 4px; border-bottom: 2px solid color-mix(in srgb, var(--el, #888) 60%, transparent); }
.ghead:first-child { margin-top: 0; } .ghead img { width: 24px; height: 24px; filter: drop-shadow(0 1px 1px #000); }
.ghead b { font-family: Rodin, Arial, sans-serif; font-weight: normal; font-size: 15px; color: var(--el, #fff); text-shadow: var(--ol); } .ghead span { margin-left: auto; font-size: 11.5px; color: var(--dim); text-shadow: var(--ol); }
.count { color: var(--dim); font-size: 12px; padding: 8px 12px 0; text-shadow: var(--ol); }

/* unit grid, like the in-game unit list */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px 6px; padding: 10px 10px 0; }
.gu { position: relative; text-align: center; cursor: pointer; }
.gu img { width: 100%; aspect-ratio: 1; display: block; }
.gu .ano, .lu .ano { font: 9.5px/1.2 Rodin, Arial, sans-serif; color: var(--accent); text-shadow: var(--ol); } .gu .ano { margin-top: 3px; } .lu .ano { font-size: 11px; }
.gu .gname { font-size: 10.5px; line-height: 1.15; margin-top: 3px; text-shadow: var(--ol); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gu .rr { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% - 46px); font-family: Rodin, Arial, sans-serif; font-size: 11px; text-shadow: var(--ol); color: var(--accent); white-space: nowrap; }
.gu img.fav { position: absolute; top: 0; right: 0; width: 22px; height: 22px; aspect-ratio: auto; filter: drop-shadow(0 1px 1px #000); }
.list { display: grid; gap: 8px; padding: 10px 10px 0; }
.lu { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 2px solid var(--gold2); background: var(--steel) center / cover; box-shadow: inset 0 0 0 1px #000; position: relative; overflow: hidden; cursor: pointer; }
.lu::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--el, #000) 24%, transparent), rgba(0,0,0,.35) 70%); pointer-events: none; }
.lu > * { position: relative; z-index: 1; }
.lu > img { width: 64px; height: 64px; flex: none; }
.lu .ln { font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); font-size: 14px; }
.lu .ls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 6px; margin-top: 4px; font-family: Rodin, Arial, sans-serif; font-size: 12px; text-shadow: var(--ol); }
.lu .ls span { display: block; font-size: 9px; color: var(--orange); }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.6); text-shadow: var(--ol); border: 1px solid rgba(0,0,0,.6); }
.badge.pw { background: linear-gradient(#5aa8ff, #1e5fe0); border-color: #9ccaff; }
.copies { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 8px 12px 0; font-size: 12.5px; } .copies[hidden] { display: none; }
.copies b { min-width: 22px; text-align: center; font-family: Rodin, Arial, sans-serif; color: var(--accent); }
.gu .own { position: absolute; top: 1px; right: 1px; width: 19px; height: 19px; border-radius: 50%; background: linear-gradient(#7ad67a, #2a8f3a); border: 1px solid #c8f5c8;
  font: 12px/17px Arial, sans-serif; color: #fff; text-shadow: var(--ol); box-shadow: 0 1px 2px #000; } .gu .own.f { right: 24px; }
.gu .cpyw { position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 1; pointer-events: none; }
.gu .cpy { position: absolute; right: 2px; bottom: 2px; padding: 0 4px; border-radius: 8px; background: rgba(0,0,0,.82); border: 1px solid rgba(255,255,255,.45);
  font: 10px/14px Rodin, Arial, sans-serif; color: #fff; text-shadow: var(--ol); }
.badge.cpyb { background: rgba(0,0,0,.75); border-color: rgba(255,255,255,.4); }
.gu .pcnt { position: absolute; left: 2px; top: 2px; z-index: 1; padding: 0 5px; border-radius: 9px; background: rgba(0,0,0,.82); border: 1px solid #ffd45c; color: #ffd45c; font: 11px/16px Rodin, Arial, sans-serif; text-shadow: var(--ol); }
.pgot { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px 8px; margin-bottom: 10px; }
.ptile { display: flex; flex-direction: column; text-align: center; min-width: 0; } .ptile img { width: 100%; aspect-ratio: 1; display: block; cursor: pointer; }
.ptile .gname { font-size: 10px; line-height: 1.15; margin-top: 2px; text-shadow: var(--ol); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ptile .pc { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: auto; padding-top: 4px; }  /* at the tile's foot: a two-line name doesn't push its row down */
.ptile .pc button { width: 26px; height: 26px; padding: 0; border-radius: 7px; border: 1px solid var(--gold3); background: #141a2e; color: var(--text); font-size: 15px; line-height: 1; cursor: pointer; }
.ptile .pc b { min-width: 20px; font: 14px Rodin, Arial, sans-serif; color: var(--accent); }
.badge.own { background: linear-gradient(#7ad67a, #2a8f3a); border-color: #c8f5c8; }
.why ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: #ece6d6; } .why li { margin: 4px 0; } .why b { color: var(--accent); font-weight: normal; font-family: Rodin, Arial, sans-serif; }
.about .news { text-align: left; background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.about .news ul { margin: 4px 0 6px; padding-left: 18px; font-size: 12.5px; } .about .news li { margin: 3px 0; } .about .news summary { font-size: 12.5px; color: var(--accent); }
.farm li { padding: 5px 0; cursor: pointer; } .farm .small { margin-top: 1px; }
.badge.wk { background: linear-gradient(#ff9ad5, #b0306f); border-color: #ffd0ea; cursor: pointer; }
.top .crest { cursor: pointer; }
.about p { margin: 6px 0; font-size: 13px; } .about .big { font: 18px Rodin, Arial, sans-serif; text-shadow: var(--ol); margin: 4px 0 2px; }
.about .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; } .about .facts div { background: rgba(0,0,0,.35); border-radius: 8px; padding: 6px 2px; }
.about .facts b { display: block; font: 16px Rodin, Arial, sans-serif; color: var(--accent); }
/* About → Privacy: the update switch, "Check for updates" and how a download is going (the app only) */
.priv { text-align: left; background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.priv .h, .tsize .h { font: 15px Rodin, Arial, sans-serif; text-shadow: var(--ol); } .tsize { margin: 10px 0 4px; } .about .priv p { font-size: 12.5px; color: #ece6d6; }
.sw { position: relative; display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw .knob { flex: none; position: relative; width: 44px; height: 24px; margin-top: 1px; border-radius: 12px; border: 2px solid var(--gold2); background: #0a1020; box-shadow: inset 0 1px 4px #000; transition: background .15s; }
.sw .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); box-shadow: 0 1px 2px #000; transition: transform .15s; }
.sw input:checked + .knob { background: var(--orange); border-color: var(--gold); } .sw input:checked + .knob::after { transform: translateX(20px); background: #fff; }
.sw input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw b { display: block; font-size: 13.5px; } .sw small { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
.upd { font-size: 12.5px; } .upd p { margin: 6px 0; } .upd ul { margin: 4px 0 8px; padding-left: 18px; } .upd li { margin: 3px 0; }
.upd .new { color: #9ff09f; font-family: Rodin, Arial, sans-serif; font-size: 14px; text-shadow: var(--ol); }
.upd .bar { height: 10px; margin: 6px 0; border-radius: 5px; border: 1px solid var(--gold2); background: #0a1020; overflow: hidden; }
.upd .bar i { display: block; height: 100%; background: linear-gradient(#7ad67a, #2a8f3a); transition: width .2s; }
.upd .err { color: var(--warn); }
.gu .pwtag { position: absolute; left: 0; top: calc(100% - 52px); font-family: Rodin, Arial, sans-serif; font-size: 10px; padding: 0 4px; border-radius: 4px; background: linear-gradient(#5aa8ff, #1e5fe0); text-shadow: var(--ol); white-space: nowrap; }
.role b { color: var(--accent); font-weight: normal; }
.badge img { width: 16px; height: 16px; } .badge .sti { width: 14px; height: 14px; margin-left: -1px; } .badge .omi { width: 17px; height: 17px; margin: -2px 1px -2px -3px; }
.chip .omi { width: 22px; height: 22px; margin: -3px 0 -3px -4px; } .badge.omni { background: linear-gradient(#ffe38a, #e0a22a 55%, #b57a16); border-color: #fff3c4; } .badge.star { color: var(--accent); } .badge.cost { color: var(--orange); }
.more:not(.scroller) { padding: 22px; text-align: center; color: var(--dim); }  /* "load more", not a chip row's scroll hint */
.empty { padding: 50px 20px; text-align: center; color: var(--dim); text-shadow: var(--ol); }
.empty b { display: block; color: var(--accent); font-family: Rodin, Arial, sans-serif; font-size: 17px; margin-bottom: 6px; }

/* detail pages */
#page { display: none; } body.sub #page { display: block; } body.sub .view { display: none !important; }
.hero { position: relative; min-height: 230px; overflow: hidden; border-bottom: 3px solid var(--gold); box-shadow: 0 3px 0 var(--gold3); }
.hero .glow { position: absolute; inset: 0; background: radial-gradient(circle at 70% 45%, color-mix(in srgb, var(--el, #888) 45%, transparent), transparent 62%), linear-gradient(#141a2e, #070810); }
.hero .art { position: absolute; right: -8%; bottom: 0; height: 100%; max-width: 92%; object-fit: contain; object-position: right bottom; filter: drop-shadow(0 6px 12px #000); }
.hero .art.icon { right: 14px; bottom: 50%; transform: translateY(50%); height: 110px; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,6,12,.72), rgba(5,6,12,.25) 55%, transparent 75%), linear-gradient(transparent 70%, rgba(5,6,12,.55)); pointer-events: none; }
.hero .info { position: relative; z-index: 1; padding: 16px 14px; max-width: 64%; }
.hero h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.15; text-shadow: var(--ol); }
.stars { display: flex; align-items: center; min-height: 24px; }
.stars img { width: 24px; height: 24px; margin-right: -4px; filter: drop-shadow(0 1px 1px #000); }
.stars img.omni { width: 34px; height: 34px; margin: -5px 2px -5px -3px; }
.stars .omnit { font-family: Rodin, Arial, sans-serif; font-size: 17px; letter-spacing: 1px; text-shadow: none; background: linear-gradient(#ff7a6b, #ffd84a 30%, #6bff8a 55%, #5ad7ff 75%, #c78bff); -webkit-background-clip: text; background-clip: text; color: transparent;

/* the unit's portrait as big as its column allows (36px, less on a narrow phone), every one at the top of its row; its

.cov .src { display: flex; flex-direction: column; align-items: center; min-width: 0; } .cov .src .pw { position: relative; display: block; line-height: 0; }

.cov .src small > span { display: block; } .cov .src .sphi img { width: 14px; height: 14px; border-radius: 3px; box-shadow: 0 0 0 1px #000; background: #0a0d18; } .cov .src .sphi img.own { opacity: .55; } .cov .src img { width: 36px; max-width: 100%; height: auto; aspect-ratio: 1; cursor: pointer; } .cov .src img.viasp { outline: 2px solid #6fd17a; outline-offset: -2px; border-radius: 4px; }
.cov .src small { margin-top: 8px; font-size: 9px; line-height: 1.1; color: var(--dim); text-align: center; text-shadow: var(--ol); } .cov .src.off img { opacity: .4; filter: grayscale(.7); }

  border: 1px solid var(--gold3); box-shadow: 0 6px 18px rgba(0,0,0,.7); font-size: 12px; line-height: 1.35; text-shadow: var(--ol); animation: fadein .12s ease-out; }
.covtip b { font-family: Rodin, Arial, sans-serif; font-weight: normal; color: var(--accent); } .covtip .ctb { display: flex; justify-content: flex-end; gap: 6px; margin-top: 7px; }
.cov .src.off.self img { opacity: 1; filter: none; outline: 2px solid #6fc3ff; outline-offset: 1px; border-radius: 6px; } .cov .src.off.self small { color: #a9dcff; } .cov .src em { font-style: normal; font-size: 9px; line-height: 1.1; color: var(--accent); text-shadow: var(--ol); text-align: center; } .cov .src { position: relative; }

.mu { display: grid; grid-template-columns: 96px repeat(6, 1fr); align-items: center; text-align: center; font-family: Rodin, Arial, sans-serif; font-size: 14px; text-shadow: var(--ol); }

/* ＋ Team: which team */

<script>
const $ = id => document.getElementById(id);
// the start screen goes once the app is ready, or after 4 s whatever happens
const hideSplash = () => { const s = $("splash"); if (s && !s.classList.contains("gone")) { s.classList.add("gone"); setTimeout(() => s.remove(), 260); } };
setTimeout(hideSplash, 4000);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const orb = e => e ? `<img src="/static/orb_${e}.png" alt="">` : "";
// the game's own stars: rarity (orange) and favorite (yellow)
const STAR = `<img class="sti" src="/static/star.png" alt="★">`, FAVSTAR = `<img class="sti" src="/static/star_fav.png" alt="★">`;
// the game's purple star: an Elgif's rarity, and the stars on an Imbued Tablet Elgif
const ESTAR = `<img class="sti" src="/static/star_elgif.png" alt="★">`, starFor = u => u.id === "50792" ? ESTAR : STAR;
const OMNI = `<img class="sti omi" src="/static/omni.png" alt="">`;  // the game's Omni rarity mark
const SEX = { M: ["m", "Male"], F: ["f", "Female"] };
const uImg = id => `/thumbs/u/${id}.webp`, iImg = id => `/thumbs/i/${id}.webp`, aImg = id => `/thumbs/a/${id}.webp`;

// thumbs/bhd (site/site_art.py); the app and the PC guide only the APK's. A unit without one keeps the APK's picture.
const HD = /(^|\.)bfcompanion\.app$/.test(location.hostname);
const artImg = async id => (HD && await loadImg(`/thumbs/ahd/${id}.webp`)) || loadImg(aImg(id));
const sImg = id => `/thumbs/s/${id}.webp`;  // the game's animated battle sprite (idle loop)
// "no-cache": ask for the newest copy every time (the PC guide's server lets a browser keep files for an hour, so an
// update could show old data); unchanged files come back as a quick "not modified"
const DB = {}, load = n => DB[n] ??= fetch(`/data/${n}.json`, { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const wiki = id => load(`w/${id}`);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// the text size chosen in About (viewportFor, in <head>); again after turning the phone, which changes its width
const applyZoom = () => { document.querySelector("meta[name=viewport]").content = viewportFor(store.get("bf.zoom", "normal")); };
addEventListener("orientationchange", () => setTimeout(applyZoom, 300));
function toast(m, ms = 1800) { if (ms <= 1800) $("toast").classList.remove("long"); $("toast").textContent = m; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), ms); }
// a toast with an Undo button, after a change that's easy to make by mistake (clearing a team, taking units out of the box)
function undoToast(m, undo, ms = 6000, label = "Undo") {  // a message with a button (Undo, or label)
  const el = $("toast"), b = document.createElement("button"); toast(m, ms); el.classList.add("long"); el.append(" ", b);
  b.className = "tundo"; b.textContent = label; b.onclick = () => { clearTimeout(toast.t); el.classList.remove("show"); undo(); };
}
$("toast").onclick = () => { clearTimeout(toast.t); $("toast").classList.remove("show"); };  // a tap closes it sooner
// numbers and dates look the same on every phone, whatever its language: "25,330", "31 October 2026"
const fmt = n => n.toLocaleString("en");
const day = t => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
// skill and sphere text with its numbers picked out: "<b>150%</b> boost to Atk for <b>3</b> turns"
const hl = t => esc(t).replace(/\d+(?:[.,]\d+)?(?:\s*[~-]\s*\d+(?:[.,]\d+)?)?%?/g, m => `<b class="nb">${m}</b>`);
// the chance to get a unit at least once in 10 pulls of p% each
const in10 = p => { const v = 100 * (1 - (1 - p / 100) ** 10); return v >= 99.95 ? ">99.9" : v < .1 ? "<0.1" : v < 10 ? v.toFixed(1) : Math.round(v); };
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function modal(html) { $("mbox").innerHTML = html; $("modal").hidden = false; }
$("modal").onclick = e => { if (e.target.id === "modal" || e.target.closest(".mclose")) $("modal").hidden = true; };
// tap the logo: version, how fresh the data is, where it comes from, where new versions are
async function showAbout() {
  const [V, S, U, I, C] = await Promise.all([load("version"), load("usrc"), load("units"), load("items"), load("changelog")]);
  const log = Array.isArray(C) ? C : [], notes = e => `<ul>${(e.notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
  const url = "https://github.com/Nervequakes/BF-Companion/releases";
  modal(`<div class="about"><img src="/static/logo.png" alt="" style="height:64px"><div class="big">BF Companion</div>
    <p class="dim">${V.version ? `Version ${esc(V.version)}${V.built ? ` · built ${day(V.built)}` : ""}` : "Offline guide for Brave Frontier Revived"}</p>
    <div class="facts"><div><b>${Object.keys(U).length.toLocaleString("en")}</b>units</div><div><b>${Object.values(I).filter(s => s.name).length.toLocaleString("en")}</b>spheres & items</div><div><b>${Object.keys(S.g || {}).length}</b>summon gates</div></div>
    ${S.built ? `<p>Revived's drop, capture and summon data from <b>${day(S.built * 1000)}</b>.</p>` : ""}
    ${log.length ? `<div class="news"><b>What's new in ${esc(log[0].version)}</b>${notes(log[0])}${log.length > 1 ? `<details><summary>Earlier versions</summary>${

  const what = r?.newer ? `<p class="new">BF Companion ${esc(r.latest)} is out</p><p class="dim">You have ${esc(r.current)}${r.date ? ` · this one came out ${day(r.date)}` : ""}</p>${

// a squad Omni unit's SP after its Omni+ level changed: the build it uses applied again at the new level (with what
// its notes add there), or, when that no longer fits, the app's pick or no SP yet, the best build for it (bestSpFor,
// else the app's pick); options chosen by hand (no build name) stay as they are
async function spAuto(slot) {
  const id = TEAMS[TCUR][slot], cur = TSPE[TCUR][slot];
  if (!id || UMAP[id]?.r !== 8 || (cur?.k?.length && !cur.b)) return;
  const w = await wiki(id);
  if (!w?.sp?.length) return;
  const lead = slot === 0 || slot === 5, lv = TOMNI[TCUR][slot] || 0, cap = omniOf(slot)[1];
  const { opts } = spOptions(id, w.sp, lead), by = Object.fromEntries(opts.map(o => [o.key, o])), cost = keys => [...keys].reduce((a, k) => a + (by[k]?.cost || 0), 0);
  let r = null;
  // the app's pick (Fill's, checked in the battle check): kept, the SP the new level adds (or takes away) on top of it
  if (cur?.b === "app") { const p = spPicks(id, w.sp, cap, new Set((cur.k || []).filter(k => by[k])), lead); r = p.keys.size ? { k: [...p.keys], b: "app" } : null; }
  else if (cur?.b) {
    const n = (w.builds || []).findIndex((b, i) => (b.name || `Build ${i + 1}`) === cur.b), b = w.builds?.[n];
    const k = b ? buildKeys(b, w.sp) : null;
    if (k?.size && cost(k) <= cap) r = { k: [...buildAt(b, w.sp, k, lv, cap, by).keys], b: cur.b };
  }
  if (!r) r = await bestSpFor(id, cap, [], lead, lv, castNow(slot, id));
  TSPE[TCUR][slot] = r; saveSquad();
}
// Fill's SP for a unit it adds: the players' build that suits what it does best (its options' worth, as the app's pick
// weighs them; a leader skill option counts only for the Leader and the Friend) within its SP, with what its notes add
// at its Omni+ (lv) and the roles Fill picked it for (need); without one, the app's pick with them
async function bestSpFor(id, budget, need = [], leaderToo = false, lv = 0, now = "") {
  const w = await wiki(id);
  if (!w?.sp?.length) return null;
  const { opts } = spOptions(id, w.sp, leaderToo), by = Object.fromEntries(opts.map(o => [o.key, o]));
  const sum = (keys, f) => [...keys].reduce((a, k) => a + (by[k]?.[f] || 0), 0);
  // the roles Fill counts on: from options for the skills it uses (now), if it's given
  const has = keys => { const r = new Set([...keys].flatMap(k => { const x = spRoleOpts(id)[k]; return spFor(x, leaderToo) && (!now || onSkill(x, now)) ? x[2].split(" ").filter(Boolean) : []; })); return need.every(c => r.has(c)); };
  const fits = (w.builds || []).map((b, n) => ({ name: b.name || `Build ${n + 1}`, k: buildKeys(b, w.sp), b })).filter(x => x.k.size && sum(x.k, "cost") <= budget)
    .map(x => ({ ...x, k: buildAt(x.b, w.sp, x.k, lv, budget, by).keys })).filter(x => has(x.k));
  if (fits.length) { const best = fits.reduce((a, x) => sum(x.k, "v") > sum(a.k, "v") + 1e-9 ? x : a); return { k: [...best.k], b: best.name }; }
  const cheapest = c => Object.entries(spRoleOpts(id)).filter(([k, x]) => by[k] && spFor(x, leaderToo) && (!now || onSkill(x, now)) && x[2].split(" ").includes(c)).sort((a, b) => a[1][0] - b[1][0])[0]?.[0];
  const p = spPicks(id, w.sp, budget, new Set(need.map(cheapest).filter(Boolean)), leaderToo);

}

  $("page").querySelectorAll("[data-u]").forEach(b => b.onclick = () => go(`#/unit/${b.dataset.u}`));
  $("page").querySelectorAll("[data-x]").forEach(b => b.onclick = () => { toggleCompare(b.dataset.x); showCompare(); });
  window.scrollTo(0, 0);
}

// ---------------- navigation ----------------
const TABS = { units: "Units", elgifs: "Elgifs", spheres: "Items", drops: "Quests", team: "Team", favs: "Favorites & box" };  // as the game's buttons say
let tab = "units", tabsDrawn = new Set();
function setTitle(t, sub) {
  $("title").textContent = t; document.body.classList.toggle("sub", !!sub);
  $("viewmode").hidden = sub || !["units", "favs"].includes(tab); $("favtab").hidden = !!sub;
  if (!sub) $("share").hidden = true;
}
function showMissing() { $("page").innerHTML = `<div class="empty"><b>Not found</b></div>`; }
function go(hash) { if (location.hash !== hash) location.hash = hash; else route(); }
const scrollPos = {};
// counts page changes: a page that finishes loading after you've moved on doesn't draw over the new one
let NAV = 0;
async function route() {
  NAV++;
  const h = location.hash || "#/units";
  if (boxEdit && h !== "#/units") setBoxEdit(false);
  let m;
  $("modal").hidden = true; updateCmpBar();
  if ((m = h.match(/^#\/unit\/(\d+)/))) return showUnit(m[1]);
  if ((m = h.match(/^#\/item\/(\d+)/))) return showItem(m[1]);
  if ((m = h.match(/^#\/pick\/(\d)(?:\?role=(\w+))?/))) return showPick(+m[1], m[2]);
  if ((m = h.match(/^#\/sphere\/(\d)\/(\d)/))) return showSpherePick(+m[1], +m[2]);
  if ((m = h.match(/^#\/elgif\/(\d)/))) return showElgifPick(+m[1]);
  if ((m = h.match(/^#\/spe\/(\d)/))) return showSpPick(+m[1]);
  if ((m = h.match(/^#\/gate\/(\d+)/))) return showGate(m[1]);
  if (h === "#/compare") return showCompare();
  if (h === "#/tiers") return showTiers();
  if ((m = h.match(/^#\/pulls(?:\/(\d+))?/))) return showPulls(m[1]);
  const t = (h.match(/^#\/(\w+)/) || [])[1];
  tab = TABS[t] ? t : "units";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + tab));
  refreshMarks($("v-" + tab));  // ★ and ✓ changed on a unit page
  fadeSoon();  // its rows of chips, shown again
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("favtab").classList.toggle("on", tab === "favs");
  setTitle(TABS[tab], false);
  if (tab === "favs") renderFavs();
  else if (tab === "team") renderTeam();
  else if (tab === "spheres" && tabsDrawn.has(tab)) refreshItemMarks();
  else if (!tabsDrawn.has(tab)) { tabsDrawn.add(tab); if (tab === "units") renderUnits(); if (tab === "spheres") renderSpheres(); if (tab === "drops") renderDrops(); if (tab === "elgifs") renderElgifs(); }
  requestAnimationFrame(() => window.scrollTo(0, scrollPos[tab] || 0));
}
addEventListener("scroll", () => { if (!document.body.classList.contains("sub")) scrollPos[tab] = scrollY; }, { passive: true });
// ▲ back to the top of a long list or page: shows while you scroll, then gets out of the way of the text
let topTimer = 0;
function onScrollTop() {
  clearTimeout(topTimer); $("totop").hidden = scrollY < 1500;
  if (scrollY >= 1500) topTimer = setTimeout(() => $("totop").hidden = true, 2500);
}
addEventListener("scroll", onScrollTop, { passive: true });
$("totop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
// Enter in a search box closes the keyboard, so the results can be seen
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches?.("input[type=search]")) e.target.blur(); });
$("ebdone").onclick = () => { setBoxEdit(false); toast(`${mine.size} unit${mine.size === 1 ? "" : "s"} in your box`); };
// box editing: every unit the filters and search show, in the box at once (or out), then tap the few that are wrong
$("eball").onclick = () => {
  const ids = filteredUnits().map(u => u.id), out = ids.filter(id => !mine.has(id)).length, inn = ids.length - out;
  if (!ids.length) return toast("No units shown");
  const what = `${esc(filterSummary())}${uState.q ? ` · “${esc(uState.q)}”` : ""}`;
  modal(`<div class="about"><div class="big">All ${ids.length} units shown</div><p class="small dim" style="margin:6px 0 10px">${what}<br>${inn} of them are in your box.</p>
    <div class="btnrow" style="justify-content:center">${out ? `<button class="gbtn green" id="eballin">✓ Put all ${ids.length} in</button>` : ""}${inn ? `<button class="gbtn red" id="eballout">Take all ${ids.length} out</button>` : ""}<button class="gbtn dark mclose">Cancel</button></div></div>`);
  const set = add => { const before = [...mine]; ids.forEach(id => add ? mine.add(id) : mine.delete(id)); saveMine(); $("modal").hidden = true;
    refreshMarks($("ulist")); $("ebn").textContent = mine.size;
    undoToast(add ? `${out} put in your box` : `${inn} taken out of your box`, () => { mine = new Set(before); saveMine(); refreshMarks($("ulist")); $("ebn").textContent = mine.size; }); };
  if ($("eballin")) $("eballin").onclick = () => set(true);
  if ($("eballout")) $("eballout").onclick = () => set(false);
};
// hold a unit in a list for a moment (or right-click it) to put it in your box or take it out, without opening it
(() => {
  let t = 0, at = null, el = null, swallow = false;
  const cell = e => e.target.closest?.(".gu[data-id], .lu[data-id], .eu[data-id]");
  const stop = () => { clearTimeout(t); t = 0; el = null; };
  const flip = c => {
    const id = c.dataset.id, u = UMAP[id]; if (!u) return;
    const add = !mine.has(id); add ? mine.add(id) : mine.delete(id); saveMine(); swallow = true;
    if (c.redraw) c.replaceWith(c.redraw()); else c.classList.toggle("got", add);
    $("ebn").textContent = mine.size;
    toast(add ? `✓ ${u.n} is in your box` : `${u.n} is out of your box`);
  };
  addEventListener("pointerdown", e => {
    stop(); swallow = false; const c = cell(e); if (!c || e.button > 0) return;
    el = c; at = [e.clientX, e.clientY]; t = setTimeout(() => { const c2 = el; stop(); if (c2?.isConnected) flip(c2); }, 500);
  }, { passive: true });
  addEventListener("pointermove", e => { if (t && Math.hypot(e.clientX - at[0], e.clientY - at[1]) > 10) stop(); }, { passive: true });
  addEventListener("pointerup", stop, { passive: true }); addEventListener("pointercancel", stop, { passive: true });
  addEventListener("scroll", stop, { passive: true, capture: true });
  // a held touch also opens the browser's menu, a right-click too: here it's the same shortcut, with no menu
  addEventListener("contextmenu", e => { const c = cell(e); if (!c) return; e.preventDefault(); if (t) { stop(); flip(c); } else if (!swallow) flip(c); });
  // the tap that ends a hold doesn't also open the unit (or pick it in the team picker)
  addEventListener("click", e => { if (!swallow) return; swallow = false;
    if (cell(e) || !e.target.closest?.("button, a, input, select, label")) { e.stopPropagation(); e.preventDefault(); } }, true);
})();
addEventListener("hashchange", route);
// a computer screen: the tab buttons go up in the header, next to ★; back at the bottom on a phone
const wide = matchMedia("(min-width: 1000px)"), navEl = document.querySelector(".nav");
const placeNav = () => $("cmpbar").before(navEl);  // a bar down the left side on a PC (its CSS), along the bottom on a phone
placeNav(); wide.onchange = placeNav;
// tapping the tab you're on goes back to the top of its list
document.querySelectorAll(".nav button").forEach(b => b.onclick = () =>
  b.dataset.tab === tab && !document.body.classList.contains("sub") ? window.scrollTo({ top: 0, behavior: "smooth" }) : go(`#/${b.dataset.tab}`));
// sideways chip rows: a fade on the side where more chips are hidden, and the mouse wheel scrolls them sideways
const scrollHint = el => { const max = el.scrollWidth - el.clientWidth;
  el.classList.toggle("less", el.scrollLeft > 2); el.classList.toggle("more", max > 2 && el.scrollLeft < max - 2); };
const scrollHints = () => document.querySelectorAll(".scroller:not(.wrap)").forEach(scrollHint);
document.addEventListener("scroll", e => e.target.classList?.contains("scroller") && scrollHint(e.target), true);  // scroll doesn't bubble
document.addEventListener("wheel", e => {
  const el = e.target.closest?.(".scroller:not(.wrap), .jump, .recent, .tabs2.teams"), x = el?.scrollLeft;
  if (el && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; if (el.scrollLeft !== x) e.preventDefault(); }  // at its ends the page scrolls
}, { passive: false });
let hintRaf = 0;
new MutationObserver(() => { cancelAnimationFrame(hintRaf); hintRaf = requestAnimationFrame(scrollHints); }).observe(document.body, { childList: true, subtree: true });
addEventListener("resize", scrollHints);
// swipe left / right on a unit page for the next / previous unit (not when scrolling a row sideways)
let swipe = null;
$("page").addEventListener("touchstart", e => {
  swipe = location.hash.startsWith("#/unit/") && !e.target.closest(".jump, .evo, .recent, .scroller, .cmp, .mats") ? [e.touches[0].clientX, e.touches[0].clientY] : null;
}, { passive: true });
$("page").addEventListener("touchend", e => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe[0], dy = e.changedTouches[0].clientY - swipe[1]; swipe = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) $(dx < 0 ? "unext" : "uprev")?.click();
}, { passive: true });
$("favtab").onclick = () => go(tab === "favs" ? "#/units" : "#/favs");
$("back").onclick = () => history.back();
$("viewmode").onclick = () => { viewMode = viewMode === "grid" ? "list" : "grid"; store.set("bf.view", viewMode); tab === "favs" ? renderFavs() : renderUnits(); };
let st; $("sq").oninput = () => { clearTimeout(st); itemSug(); st = setTimeout(renderSpheres, 80); };
$("sq").addEventListener("focus", itemSug); $("sq").addEventListener("blur", () => setTimeout(itemSug, 300));
$("ssug").onclick = e => { const b = e.target.closest("[data-sq]"); if (b) setItemQuery(b.dataset.sq); else if (e.target.closest(".sughelp")) itemSearchHelp(); };
let et; $("eq").oninput = () => { clearTimeout(et); et = setTimeout(renderElgifs, 80); };
let dt; $("dq").oninput = () => { clearTimeout(dt); dt = setTimeout(renderDrops, 120); };
$("dq").onchange = saveDropSearch;  // Enter or closing the keyboard keeps the search in "Recent searches"
$("dres").addEventListener("click", e => { if (e.target.closest(".ichip, .item")) saveDropSearch(); });
// Android back button (MainActivity calls this): leave a page, else let the app close
window.BFBack = () => {
  if (!$("modal").hidden) { $("modal").hidden = true; return true; }
  if (document.body.classList.contains("sub") || (location.hash && location.hash !== "#/units")) { history.back(); return true; }
  return false;
};

(async () => {
  const [U, T] = await Promise.all([load("units"), load("tags"), load("banners").then(b => { BAN = b; }), load("events").then(e => { EVT = new Set(e?.rotating || []); }), load("week").then(w => { WK = w || {}; })]);
  TAGS = { labels: {}, units: {}, power: {}, powerUnit: {}, ...T };
  for (const p of Object.values(TAGS.power)) for (const [c, [v]] of Object.entries(p)) POWER_MAX[c] = Math.max(POWER_MAX[c] || 0, c === "heal" ? Math.min(v, 10000) : v);
  // no: the wiki's release number (Newest, Fill's newness); ar: the game's own Unit Archive number
  UNITS = Object.entries(U).map(([id, [n, r, e, c, h1, a1, d1, r1, hm, am, dm, rm, no, ar]]) =>
    ({ id, n, r, e, c, h1, a1, d1, r1, hp: hm || h1, atk: am || a1, def: dm || d1, rec: rm || r1, no: no || 0, ar: ar || 0, f: r <= 5 && FODDER.test(n) }));
  UMAP = Object.fromEntries(UNITS.map(u => [u.id, u]));
  setupUnitFilters();
  try { await route(); } finally { hideSplash(); }
  Promise.all([load("version"), load("changelog").catch(() => [])]).then(([V, C]) => {
    const seen = store.get("bf.seenv", null), used = ["bf.recent", "bf.favs", "bf.ifavs", "bf.teams"].some(k => store.get(k, null) !== null);
    if (!V.version || seen === V.version) return;
    store.set("bf.seenv", V.version);
    if (seen && Array.isArray(C) && C[0]?.version === seen) return;  // a silent update: nothing new in What's new since the version they saw
    if (seen || used) setTimeout(showAbout, 600);
  });
  // the update switch: ask GitHub on start, at most every 6 hours (after What's new, which then shows the answer)
  if (canUpdate() && UPD.auto && !(Date.now() - store.get("bf.updlast", 0) < 6 * 3600e3)) setTimeout(() => checkUpdate(false), 1500);
  // read the big files while nothing happens, so the first unit, item or search opens at once
  const idle = window.requestIdleCallback || (f => setTimeout(f, 800));
  idle(() => {
    fmt(1000); day(0);  // number and date formatting are slow the first time: not on the first unit opened
    ["details", "items", "usrc", "drops"].reduce((p, n) => p.then(() => load(n)), Promise.resolve());
  });
})();
</script>
