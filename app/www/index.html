<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BF Companion</title>
<meta name="theme-color" content="#161922">
<style>
/* The phone app: a guide to every Brave Frontier unit, styled after the game (its textures and font in /static).
   Data: /data/units.json, details.json, items.json, drops.json and /data/w/<id>.json (from the wiki). */
@font-face { font-family: Rodin; src: url(/static/rodin.woff2) format("woff2"); font-display: swap; }
:root {
  --bg: #0b0a14; --card: #141a2e; --card2: #1b2340; --line: #2a3350; --text: #fff; --dim: #c9c3b2; --accent: #ffd45c; --warn: #ff9a3c;
  --gold: #e9c868; --gold2: #b8902f; --gold3: #5a3f12; --orange: #f7a21b; --blue: #3f8cff;
  --Fire: #ff6a47; --Water: #49a4ff; --Earth: #5fc56c; --Thunder: #ffd24a; --Light: #f2ecd8; --Dark: #b382ff;
  --ol: 0 0 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 3px rgba(0,0,0,.7);
  --steel: url(/static/iphx_footer.png); --navh: 78px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { color-scheme: dark; }
body { margin: 0; color: var(--text); font: 14px/1.45 Arial, "Segoe UI", sans-serif; background: var(--bg); overscroll-behavior-y: none; }
/* the backdrop on its own fixed layer: a "fixed" page background makes a phone repaint the whole page while scrolling */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; transform: translateZ(0);
  background: linear-gradient(rgba(6,4,16,.5), rgba(6,4,16,.75)), var(--bg) url(/static/base.jpg) center top / cover; }
.r, h1, h2, h3, .tag, .chip, .nav button, .badge, .st, .gname, .pill, .tbl th, .tbl td, .tabs2 button, select { font-family: Rodin, "Arial Black", Arial, sans-serif; }
.ol { text-shadow: var(--ol); }
button, select, input { font: inherit; color: var(--text); }
input, select { background: linear-gradient(#0a1020, #121a36); border: 2px solid var(--gold2); border-radius: 10px; padding: 8px 12px; box-shadow: inset 0 0 0 1px #000, inset 0 2px 10px rgba(0,0,0,.7); }
input:focus, select:focus { outline: none; border-color: var(--accent); }
select { text-shadow: var(--ol); font-size: 13px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top));
  background: var(--steel) center / cover; border-bottom: 3px solid var(--gold); box-shadow: 0 3px 0 var(--gold3), 0 8px 18px rgba(0,0,0,.7); }
.top .crest { height: 42px; filter: drop-shadow(0 2px 3px #000); }
.top h1 { font-size: 19px; margin: 0; text-shadow: var(--ol); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { display: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #6ab0ff, #1a4fd0 60%, #0f2f8a);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 3px #000; font-size: 20px; text-shadow: var(--ol); }
body.sub .top .back { display: grid; place-items: center; } body.sub .top .crest { display: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--gold2); background: linear-gradient(#0a1020, #121a36); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; } .iconbtn.on { border-color: var(--accent); color: var(--accent); }
.iconbtn img { width: 26px; height: 26px; filter: grayscale(1) brightness(.75) drop-shadow(0 1px 1px #000); } .iconbtn.on img { filter: drop-shadow(0 0 4px #ffd76a); }

/* bottom navigation: the game's own footer buttons */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 6px; padding: 5px 8px 4px; padding-bottom: max(4px, env(safe-area-inset-bottom));
  background: var(--steel) center / cover; border-top: 3px solid var(--gold); box-shadow: 0 -3px 0 var(--gold3), 0 -8px 18px rgba(0,0,0,.7); }
.nav button { padding: 0; border: 0; background: none; width: min(68px, calc((100vw - 48px) / 5)); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav button img { width: 100%; height: auto; max-height: 64px; display: block; margin: 0 auto; transition: transform .15s, filter .15s; filter: brightness(.7) saturate(.7) drop-shadow(0 2px 2px #000); }
.nav button.on img { filter: drop-shadow(0 0 5px rgba(255,215,106,.9)) drop-shadow(0 2px 2px #000); transform: translateY(-3px) scale(1.06); }
.nav button:active img { transform: scale(.94); }
.sti { width: 1.2em; height: 1.2em; vertical-align: -.25em; }
main { padding-bottom: calc(var(--navh) + 20px); }
.view { display: none; } .view.on { display: block; }

/* filters */
.bar2 { position: sticky; top: 57px; z-index: 10; padding: 8px 12px; background: linear-gradient(rgba(11,10,20,.96), rgba(11,10,20,.86)); border-bottom: 1px solid var(--gold3); }
.searchrow { display: flex; gap: 8px; } .searchrow input { flex: 1; min-width: 0; }
.scroller { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; } .scroller::-webkit-scrollbar { display: none; }
.scroller.wrap { flex-wrap: wrap; overflow: visible; padding: 10px 12px 0; }  /* every chip on screen: no sideways row that cuts off */
/* a sideways row: a fade on the side where more chips are hidden (phones show no scrollbar), a slim one with a mouse */
.scroller.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); }
.scroller.less { -webkit-mask-image: linear-gradient(to right, transparent, #000 30px); mask-image: linear-gradient(to right, transparent, #000 30px); }
.scroller.less.more { -webkit-mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, transparent, #000 30px, #000 calc(100% - 30px), transparent); }
@media (pointer: fine) { .scroller:not(.wrap) { scrollbar-width: thin; scrollbar-color: var(--gold3) transparent; padding-bottom: 6px; }
  .scroller:not(.wrap)::-webkit-scrollbar { display: block; height: 6px; } .scroller:not(.wrap)::-webkit-scrollbar-thumb { background: var(--gold3); border-radius: 3px; } }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; text-shadow: var(--ol);
  border: 2px solid var(--gold2); background: linear-gradient(#0a1020, #121a36); box-shadow: inset 0 0 0 1px #000; opacity: .55; }
.chip img { width: 22px; height: 22px; filter: drop-shadow(0 1px 1px #000); } .chip .sti { width: 17px; height: 17px; margin-left: -3px; } .chip.on { opacity: 1; border-color: var(--gold); background: linear-gradient(#20305c, #0f1733); }
.fsum { margin-top: 8px; font-size: 12px; color: var(--dim); text-shadow: var(--ol); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .fsum b { color: var(--accent); }
.fbtn { position: relative; flex: none; } .fbtn span { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: #e8531a; font: 11px/18px Rodin, Arial, sans-serif; text-shadow: var(--ol); }
.fbtn span:empty { display: none; }
.ghead { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin: 8px 0 -2px; padding: 0 2px 4px; border-bottom: 2px solid color-mix(in srgb, var(--el, #888) 60%, transparent); }
.ghead:first-child { margin-top: 0; } .ghead img { width: 24px; height: 24px; filter: drop-shadow(0 1px 1px #000); }
.ghead b { font-family: Rodin, Arial, sans-serif; font-weight: normal; font-size: 15px; color: var(--el, #fff); text-shadow: var(--ol); } .ghead span { margin-left: auto; font-size: 11.5px; color: var(--dim); text-shadow: var(--ol); }
.count { color: var(--dim); font-size: 12px; padding: 8px 12px 0; text-shadow: var(--ol); }

/* unit grid, like the in-game unit list */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px 6px; padding: 10px 10px 0; }
.gu { position: relative; text-align: center; cursor: pointer; }
.gu img { width: 100%; aspect-ratio: 1; display: block; }
.gu .gname { font-size: 10.5px; line-height: 1.15; margin-top: 3px; text-shadow: var(--ol); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gu .rr { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% - 46px); font-family: Rodin, Arial, sans-serif; font-size: 11px; text-shadow: var(--ol); color: var(--accent); white-space: nowrap; }
.gu img.fav { position: absolute; top: 0; right: 0; width: 22px; height: 22px; aspect-ratio: auto; filter: drop-shadow(0 1px 1px #000); }
.list { display: grid; gap: 8px; padding: 10px 10px 0; }
.lu { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 2px solid var(--gold2); background: var(--steel) center / cover; box-shadow: inset 0 0 0 1px #000; position: relative; overflow: hidden; cursor: pointer; }
.lu::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--el, #000) 24%, transparent), rgba(0,0,0,.35) 70%); pointer-events: none; }
.lu > * { position: relative; z-index: 1; }
.lu > img { width: 64px; height: 64px; flex: none; }
.lu .ln { font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); font-size: 14px; }
.lu .ls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 6px; margin-top: 4px; font-family: Rodin, Arial, sans-serif; font-size: 12px; text-shadow: var(--ol); }
.lu .ls span { display: block; font-size: 9px; color: var(--orange); }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.6); text-shadow: var(--ol); border: 1px solid rgba(0,0,0,.6); }
.badge.pw { background: linear-gradient(#5aa8ff, #1e5fe0); border-color: #9ccaff; }
.gu .own { position: absolute; top: 1px; right: 1px; width: 19px; height: 19px; border-radius: 50%; background: linear-gradient(#7ad67a, #2a8f3a); border: 1px solid #c8f5c8;
  font: 12px/17px Arial, sans-serif; color: #fff; text-shadow: var(--ol); box-shadow: 0 1px 2px #000; } .gu .own.f { right: 24px; }
.badge.own { background: linear-gradient(#7ad67a, #2a8f3a); border-color: #c8f5c8; }
.why ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: #ece6d6; } .why li { margin: 4px 0; } .why b { color: var(--accent); font-weight: normal; font-family: Rodin, Arial, sans-serif; }
.about .news { text-align: left; background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.about .news ul { margin: 4px 0 6px; padding-left: 18px; font-size: 12.5px; } .about .news li { margin: 3px 0; } .about .news summary { font-size: 12.5px; color: var(--accent); }
.farm li { padding: 5px 0; cursor: pointer; } .farm .small { margin-top: 1px; }
.badge.wk { background: linear-gradient(#ff9ad5, #b0306f); border-color: #ffd0ea; cursor: pointer; }
.top .crest { cursor: pointer; }
.about p { margin: 6px 0; font-size: 13px; } .about .big { font: 18px Rodin, Arial, sans-serif; text-shadow: var(--ol); margin: 4px 0 2px; }
.about .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; } .about .facts div { background: rgba(0,0,0,.35); border-radius: 8px; padding: 6px 2px; }
.about .facts b { display: block; font: 16px Rodin, Arial, sans-serif; color: var(--accent); }
.gu .pwtag { position: absolute; left: 0; top: calc(100% - 52px); font-family: Rodin, Arial, sans-serif; font-size: 10px; padding: 0 4px; border-radius: 4px; background: linear-gradient(#5aa8ff, #1e5fe0); text-shadow: var(--ol); white-space: nowrap; }
.role b { color: var(--accent); font-weight: normal; }
.badge img { width: 16px; height: 16px; } .badge .sti { width: 14px; height: 14px; margin-left: -1px; } .badge .omi { width: 17px; height: 17px; margin: -2px 1px -2px -3px; }
.chip .omi { width: 22px; height: 22px; margin: -3px 0 -3px -4px; } .badge.omni { background: linear-gradient(#ffe38a, #e0a22a 55%, #b57a16); border-color: #fff3c4; } .badge.star { color: var(--accent); } .badge.cost { color: var(--orange); }
.more { padding: 22px; text-align: center; color: var(--dim); }
.empty { padding: 50px 20px; text-align: center; color: var(--dim); text-shadow: var(--ol); }
.empty b { display: block; color: var(--accent); font-family: Rodin, Arial, sans-serif; font-size: 17px; margin-bottom: 6px; }

/* detail pages */
#page { display: none; } body.sub #page { display: block; } body.sub .view { display: none !important; }
.hero { position: relative; min-height: 230px; overflow: hidden; border-bottom: 3px solid var(--gold); box-shadow: 0 3px 0 var(--gold3); }
.hero .glow { position: absolute; inset: 0; background: radial-gradient(circle at 70% 45%, color-mix(in srgb, var(--el, #888) 45%, transparent), transparent 62%), linear-gradient(#141a2e, #070810); }
.hero .art { position: absolute; right: -8%; bottom: 0; height: 100%; max-width: 92%; object-fit: contain; object-position: right bottom; filter: drop-shadow(0 6px 12px #000); }
.hero .art.icon { right: 14px; bottom: 50%; transform: translateY(50%); height: 110px; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,6,12,.72), rgba(5,6,12,.25) 55%, transparent 75%), linear-gradient(transparent 70%, rgba(5,6,12,.55)); pointer-events: none; }
.hero .info { position: relative; z-index: 1; padding: 16px 14px; max-width: 64%; }
.hero h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.15; text-shadow: var(--ol); }
.stars { display: flex; align-items: center; min-height: 24px; }
.stars img { width: 24px; height: 24px; margin-right: -4px; filter: drop-shadow(0 1px 1px #000); }
.stars img.omni { width: 34px; height: 34px; margin: -5px 2px -5px -3px; }
.stars .omnit { font-family: Rodin, Arial, sans-serif; font-size: 17px; letter-spacing: 1px; text-shadow: none; background: linear-gradient(#ff7a6b, #ffd84a 30%, #6bff8a 55%, #5ad7ff 75%, #c78bff); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000); }
.hero .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; } .hero .meta .badge img { width: 18px; height: 18px; }
.favbtn { position: absolute; right: 12px; top: 12px; z-index: 2; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--gold2); background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 0; }
.navarrows { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; font-family: Rodin, Arial, sans-serif; font-size: 11px; text-shadow: var(--ol); }
.navarrows button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--gold2); background: rgba(0,0,0,.6); font-size: 24px; line-height: 1; padding: 0 0 3px; }
.navarrows button:disabled { opacity: .3; }
.chipwrap { display: flex; flex-wrap: wrap; gap: 6px; }
/* squad numbers, styled after the game's Manage Squad panels */
.sqbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.costplate { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 8px; border: 2px solid var(--gold2); background: linear-gradient(#1c2340, #0b1024);
  font-family: Rodin, Arial, sans-serif; color: var(--orange); text-shadow: var(--ol); font-size: 14px; }
.costplate b { color: #fff; font-weight: normal; font-size: 17px; } .costplate.over b { color: #ff7a6b; }
.costplate input { width: 52px; padding: 2px 6px; font-size: 15px; font-family: Rodin, Arial, sans-serif; border-radius: 6px; }
.scards { display: grid; gap: 8px; } @media (min-width: 560px) { .scards { grid-template-columns: 1fr 1fr; } }
.scard { position: relative; padding: 8px; border-radius: 10px; border: 2px solid var(--gold2); background: linear-gradient(90deg, color-mix(in srgb, var(--el) 22%, transparent), rgba(0,0,0,.45) 60%), linear-gradient(#141a2e, #0a0d18); box-shadow: inset 0 0 0 1px #000; }
.sch { display: flex; align-items: center; gap: 8px; } .sch .ic { width: 46px; height: 46px; flex: none; cursor: pointer; }
.scn { flex: 1; min-width: 0; font-family: Rodin, Arial, sans-serif; font-size: 13px; text-shadow: var(--ol); line-height: 1.2; cursor: pointer; }
.scn small { display: block; font-family: Arial, sans-serif; font-size: 11px; color: var(--dim); }
.ttype { height: 30px; font-size: 11.5px; padding: 0 6px; flex: none; }
.scs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; margin: 8px 0 4px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.1);
  font-family: Rodin, Arial, sans-serif; font-size: 15px; text-shadow: var(--ol); font-variant-numeric: tabular-nums; }
.scs div { white-space: nowrap; } .scs i { font-style: normal; font-size: 11px; color: #ffd45c; margin-right: 4px; } .scs i.c { color: var(--orange); }
.spct { font-size: 10.5px; color: #9ff09f; margin: 0 0 6px; }
.ssph { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sphc { display: flex; align-items: center; gap: 4px; min-width: 0; height: 34px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--gold2); background: rgba(0,0,0,.4); font-size: 11px; text-align: left; }
.sphc img { width: 26px; height: 26px; flex: none; object-fit: contain; } .sphc span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sphc.none { color: var(--dim); justify-content: center; border-style: dashed; }
.sca { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.bcrow { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.07); } .bcrow img { width: 40px; height: 40px; flex: none; cursor: pointer; }
.bcl { font-size: 12.5px; } .bcl b { font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); } .bcd { font-size: 12px; color: var(--dim); } .bcd b { color: var(--accent); font-weight: normal; font-family: Rodin, Arial, sans-serif; }
.okc { color: #7ad67a; } .noc { color: #ff8a7a; } .bcl .okc, .bcl .noc { margin-left: 4px; font-size: 11px; }
.item .sb { font-size: 11px; color: #9ff09f; margin: 1px 0 2px; }
.item .t .sti { width: 14px; height: 14px; flex: none; }  /* not the 46px item icon size */
/* Elgifs: rarity on the left, the whole effect (sphere text is cut at two lines) */
.item .er { flex: none; width: 46px; text-align: center; font-family: Rodin, Arial, sans-serif; font-size: 12px; color: var(--accent); text-shadow: var(--ol); }
.item .er .sti { width: 15px; height: 15px; vertical-align: -2px; } .item .er .omi { width: 30px; height: 30px; display: block; margin: 0 auto; }
.item .eff { color: #ece6d6; font-size: 12px; margin-top: 2px; }
.item .craft.got { background: linear-gradient(#7ad67a, #2a8f3a); }

.ecatch ul { margin: 5px 0 3px; padding-left: 16px; } .ecatch li { margin: 2px 0; } .ecatch b { font-weight: normal; font-family: Rodin, Arial, sans-serif; color: var(--accent); }
.item .eget { margin-top: 6px; font-size: 12px; color: var(--dim); } .item .eget > div { margin: 3px 0; } .item .eget b { color: #ece6d6; font-weight: normal; }
.item .craft { margin-left: 6px; font-size: 9.5px; padding: 0 6px; border-radius: 999px; background: linear-gradient(#5aa8ff, #1e5fe0); text-shadow: var(--ol); vertical-align: 2px; }
.recent { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; clear: both; } .recent::-webkit-scrollbar { display: none; }
.recent .eu { flex: none; width: 64px; text-align: center; cursor: pointer; } .recent .eu img { width: 56px; height: 56px; object-fit: contain; }
.recent .eu .gname { font-size: 9.5px; line-height: 1.15; text-shadow: var(--ol); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.favbtn img { width: 30px; height: 30px; filter: grayscale(1) brightness(.6); transition: .15s; } .favbtn.on { border-color: var(--accent); } .favbtn.on img { filter: drop-shadow(0 0 5px #ffd76a); transform: scale(1.1); }
.sec { margin: 12px 10px; padding: 12px; border-radius: 12px; border: 2px solid var(--gold2); background: linear-gradient(rgba(12,16,32,.92), rgba(8,10,20,.92)); box-shadow: inset 0 0 0 1px #000, 0 3px 6px #000; }
.sec > h3 { display: inline-block; margin: 0 0 10px; padding: 3px 18px 3px 12px; font-size: 13px; text-shadow: var(--ol); background: linear-gradient(#ff9a3c, #e8531a 55%, #c73a0e);
  border: 2px solid #ffd37a; border-radius: 6px 14px 14px 6px; box-shadow: 0 2px 4px #000; }
.sec > h3.blue { background: linear-gradient(#5aa8ff, #1e5fe0 55%, #123fa8); border-color: #9ccaff; }
.sec > h3.green { background: linear-gradient(#7ad67a, #2a8f3a); border-color: #c9f0b0; }
.sec > h3.purple { background: linear-gradient(#d7a6ff, #7a3fc4); border-color: #eed8ff; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; text-shadow: var(--ol); }
.tbl th { color: var(--orange); font-size: 10.5px; text-align: right; padding: 3px 4px; font-weight: normal; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 5px 4px; border-top: 1px solid rgba(255,255,255,.06); font-variant-numeric: tabular-nums; }
.tbl td.best { color: var(--accent); }
.sk { padding: 10px 0; border-top: 1px dashed var(--gold3); } .sk:first-of-type { border-top: 0; padding-top: 0; }
.sk .kn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 10.5px; padding: 2px 8px; border-radius: 5px; text-shadow: var(--ol); background: linear-gradient(#5aa8ff, #1e5fe0); border: 1px solid rgba(255,255,255,.35); }
.tag.ls { background: linear-gradient(#ff9a3c, #c73a0e); } .tag.es { background: linear-gradient(#d7a6ff, #7a3fc4); } .tag.dbb { background: linear-gradient(#ffe38a, #c98a16); }
.tag.ubb { background: linear-gradient(#ff7ab0, #b8237a); } .tag.sbb { background: linear-gradient(#7ad6ff, #1e8fe0); }
.sk .nm { font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); color: var(--accent); font-size: 14px; }
.sk p { margin: 5px 0 0; color: #ece6d6; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.pill { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: var(--dim); }
.note { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.45); border-left: 3px solid var(--blue); color: #c8d6ff; font-size: 12.5px; white-space: pre-line; overflow-wrap: anywhere; }
.fx { list-style: none; margin: 6px 0 0; padding: 0; border-radius: 6px; background: rgba(0,0,0,.45); border-left: 3px solid var(--blue); }
.fx li { padding: 6px 8px; color: #dfe7ff; font-size: 12.5px; overflow-wrap: anywhere; } .fx li + li { border-top: 1px solid rgba(255,255,255,.07); }
.fxm { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.fxd, .fxt { font-size: 10px; padding: 0 6px; border-radius: 999px; line-height: 16px; }
.fxd { background: rgba(63,140,255,.3); color: #cfe0ff; } .fxt { background: rgba(255,255,255,.1); color: var(--dim); }
.dim { color: var(--dim); } .small { font-size: 12px; }
.sp { padding: 8px 0; border-top: 1px dashed var(--gold3); } .sp:first-of-type { border-top: 0; }
.sp .cat { font-family: Rodin, Arial, sans-serif; color: var(--orange); text-shadow: var(--ol); font-size: 12.5px; margin-bottom: 4px; }
.spo { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
.spo .c { flex: none; min-width: 38px; text-align: center; font-family: Rodin, Arial, sans-serif; font-size: 11.5px; padding: 1px 5px; border-radius: 6px; background: linear-gradient(#ffe38a, #c98a16); text-shadow: var(--ol); }
.evo { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.evo .eu { flex: none; width: 72px; text-align: center; cursor: pointer; } .evo .eu img { width: 64px; height: 64px; } .evo .eu.cur img { filter: drop-shadow(0 0 6px var(--accent)); }
.evo .eu .gname { font-size: 10px; line-height: 1.15; text-shadow: var(--ol); }
.evo .ar { color: var(--accent); font-size: 20px; text-shadow: var(--ol); flex: none; }
.mats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .mats .eu { width: 58px; } .mats .eu img { width: 52px; height: 52px; }
.quote { margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid var(--gold2); background: rgba(0,0,0,.35); font-style: italic; color: #ece6d6; }
.quote b { display: block; font-style: normal; font-family: Rodin, Arial, sans-serif; font-size: 11px; color: var(--orange); text-shadow: var(--ol); margin-bottom: 2px; }
.lore { white-space: pre-line; color: #ece6d6; }
.tabs2 { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs2 button { flex: 1; height: 36px; border-radius: 8px; border: 2px solid var(--gold2); background: linear-gradient(#1c2340, #0b1024); text-shadow: var(--ol); font-size: 12.5px; }
.tabs2 button.on { border-color: var(--gold); background: linear-gradient(#3f8cff, #1a4fd0 60%, #0f2f8a); }
details > summary { cursor: pointer; color: var(--accent); font-family: Rodin, Arial, sans-serif; font-size: 12px; text-shadow: var(--ol); list-style: none; margin-top: 6px; }
details > summary::before { content: "▸ "; } details[open] > summary::before { content: "▾ "; }

/* spheres, items, drops */
.item { display: flex; gap: 10px; align-items: center; padding: 8px; margin: 0 10px 8px; border-radius: 10px; border: 2px solid var(--gold2); background: linear-gradient(rgba(12,16,32,.92), rgba(8,10,20,.92)); box-shadow: inset 0 0 0 1px #000; cursor: pointer; }
.item img { width: 46px; height: 46px; flex: none; object-fit: contain; }
.item .t { font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); } .item .s { color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.get { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
.get > li { padding: 6px 0; border-top: 1px dashed var(--gold3); display: flex; gap: 8px; align-items: flex-start; } .get > li > div { min-width: 0; flex: 1; }
.gtag { flex: none; font-size: 10px; padding: 2px 7px; border-radius: 5px; text-shadow: var(--ol); border: 1px solid rgba(255,255,255,.35); margin-top: 1px; background: linear-gradient(#6d7a99, #3a4663); font-family: Rodin, Arial, sans-serif; }
.gtag.craft { background: linear-gradient(#5aa8ff, #1e5fe0); } .gtag.raid { background: linear-gradient(#ff9a3c, #c73a0e); } .gtag.quests { background: linear-gradient(#7ad67a, #2a8f3a); }
.gtag.achievement, .gtag.questreward, .gtag.grandquestreward, .gtag.clearreward { background: linear-gradient(#ffe38a, #c98a16); } .gtag.exchange, .gtag.shop { background: linear-gradient(#d7a6ff, #7a3fc4); }
.gtag.drops, .gtag.capture { background: linear-gradient(#7ad67a, #2a8f3a); } .gtag.summon { background: linear-gradient(#ff9ad5, #b0306f); } .gtag.eventshop { background: linear-gradient(#d7a6ff, #7a3fc4); } .gtag.frontier { background: linear-gradient(#7fd3ff, #1f6fb0); } .gtag.arena { background: linear-gradient(#ff8a7a, #b8322e); }
.glink { cursor: pointer; } .glink b::after { content: " ›"; color: var(--gold); }
.gate { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-top: 1px solid rgba(255,255,255,.07); cursor: pointer; } .gate b { flex: 1; font-weight: normal; }
.gate .n { font-size: 11px; color: var(--dim); white-space: nowrap; }
.ulink { color: var(--accent); text-decoration: underline; cursor: pointer; }
.rowlbl { flex: none; align-self: center; font-size: 11px; color: var(--dim); }
.qlist.drops li { padding: 4px 0; } .qlist.drops li + li { border-top: 1px solid rgba(255,255,255,.06); }
.chance { font-size: 10.5px; padding: 0 7px; border-radius: 999px; line-height: 17px; background: linear-gradient(#7ad67a, #2a8f3a); font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); }
.boss { font-size: 10px; padding: 0 6px; border-radius: 999px; line-height: 16px; background: linear-gradient(#ff7a6b, #b8232a); text-shadow: var(--ol); }
.ichip small { color: #9ff09f; font-family: Rodin, Arial, sans-serif; margin-left: 2px; }
.qlist { list-style: none; margin: 0; padding: 0; } .qlist li { padding: 1px 0; } .qlist b { font-weight: normal; color: #fff; }
.src { font-size: 10px; color: #9aa4bf; margin: 1px 0 3px; } .rv { font-size: 10px; color: #7ad67a; margin-left: 6px; white-space: nowrap; }
.nog { margin-left: 6px; font-size: 9.5px; padding: 0 6px; border-radius: 999px; border: 1px solid #6b6f80; color: #b9bccb; vertical-align: 2px; white-space: nowrap; }
.mlist { list-style: none; margin: 6px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--gold3); } .mlist > li { padding: 4px 0 4px 8px; } .mlist b { color: var(--accent); font-weight: 600; }
.mlist .get > li { border-top: 0; padding: 2px 0; }
.place { padding: 10px 0; border-top: 1px dashed var(--gold3); } .place b { display: block; margin-bottom: 6px; font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); font-size: 13px; }
.ichip { display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 6px 0; padding: 3px 10px 3px 4px; border-radius: 999px; border: 2px solid var(--gold2); background: linear-gradient(#0a1020, #121a36); font-size: 12.5px; text-shadow: var(--ol); }
.ichip img { width: 24px; height: 24px; object-fit: contain; }
.toast { position: fixed; left: 50%; bottom: calc(var(--navh) + 24px); transform: translate(-50%, 10px); background: linear-gradient(#ffe38a, #e0a22a); padding: 9px 18px; border-radius: 10px; font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); border: 2px solid #fff3c4; opacity: 0; transition: .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* game-style buttons, my box, roles */
.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 9px; border: 2px solid #ffd37a; font-family: Rodin, Arial, sans-serif; font-size: 13px; text-shadow: var(--ol);
  background: linear-gradient(#ff9a3c, #e8531a 55%, #c73a0e); box-shadow: inset 0 0 0 1px #000, 0 2px 4px #000; cursor: pointer; }
.gbtn.blue { background: linear-gradient(#5aa8ff, #1e5fe0 55%, #123fa8); border-color: #9ccaff; } .gbtn.red { background: linear-gradient(#ff6b6b, #b8232a); border-color: #ffb3b3; }
.gbtn.dark { background: linear-gradient(#1c2340, #0b1024); border-color: var(--gold2); } .gbtn.green { background: linear-gradient(#7ad67a, #2a8f3a 55%, #1d6b2a); border-color: #c8f5c8; } .gbtn.small { height: 30px; padding: 0 10px; font-size: 11.5px; }
.gbtn.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 2px 4px #000; }
.gbtn:disabled { opacity: .45; } .gbtn:active:not(:disabled) { transform: translateY(1px); filter: brightness(1.1); }
select.gsel { height: 38px; font-size: 12.5px; padding: 0 10px; }
.btngrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; } .btngrid > * { min-width: 0; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.roles { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
.role { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(90,168,255,.18); text-shadow: var(--ol); }
.role small { color: var(--dim); font-size: 9.5px; margin-left: 3px; }
.acts { display: flex; gap: 8px; margin: 10px 10px 0; } .acts .gbtn { flex: 1; }
.qty { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .qty .gbtn { width: 38px; padding: 0; font-size: 18px; }
.qty b { font-family: Rodin, Arial, sans-serif; font-size: 20px; min-width: 30px; text-align: center; text-shadow: var(--ol); }
.need { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ni { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 5px 7px; border-radius: 8px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.09); cursor: pointer; font-size: 12px; }
.ni img { width: 30px; height: 30px; flex: none; object-fit: contain; } .ni b { flex: none; color: var(--accent); font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); }
.ni span { min-width: 0; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.ctree, .ctree ul { list-style: none; margin: 4px 0 0; padding: 0; } .ctree ul { padding-left: 14px; border-left: 1px dashed var(--gold3); margin-left: 10px; }
.ctree li { padding: 3px 0; } .ci { cursor: pointer; font-size: 12.5px; } .ci img { width: 22px; height: 22px; vertical-align: -6px; margin-right: 4px; object-fit: contain; }
.ci b { color: var(--accent); } .ci small { color: var(--dim); font-size: 10px; }
.jump { position: sticky; top: 57px; z-index: 9; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; padding: 7px 10px;
  background: linear-gradient(rgba(11,10,20,.97), rgba(11,10,20,.9)); border-bottom: 1px solid var(--gold3); }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; height: 28px; padding: 0 11px; border-radius: 999px; border: 2px solid var(--gold2); background: linear-gradient(#1c2340, #0b1024);
  font-family: Rodin, Arial, sans-serif; font-size: 11.5px; text-shadow: var(--ol); }
#ubody > .sec, #v-team > .sec { scroll-margin-top: 112px; }

/* battle sprite stage and the team formation */
.stage { position: relative; min-height: 170px; margin: -2px -2px 0; border-radius: 9px; overflow: hidden; background: #2b3a1c url(/static/battle_bg.jpg) center 62% / cover; display: grid; place-items: end center; padding: 10px 0 18px; }
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.05), rgba(0,0,0,.25)); pointer-events: none; }
.stage .spr { position: relative; z-index: 1; image-rendering: pixelated; filter: drop-shadow(0 3px 2px rgba(0,0,0,.5)); }
.formation { position: relative; isolation: isolate; height: 330px; border-radius: 12px; overflow: hidden; border: 2px solid var(--gold2); box-shadow: inset 0 0 0 1px #000, 0 3px 6px #000; background: #2b3a1c url(/static/battle_bg.jpg) center 70% / cover; }
.slot { position: absolute; width: 112px; height: 104px; transform: translate(-50%, -100%); padding: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }
.slot img { max-width: 112px; max-height: 88px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.55)); }
.slot .pad { position: relative; width: 70px; height: 24px; margin-bottom: 2px; border-radius: 50%; border: 2px dashed rgba(255,236,170,.9);
  background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,.2)); box-shadow: 0 0 12px rgba(255,215,106,.35); }
.slot .pad b { position: absolute; left: 50%; bottom: 9px; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 40% 35%, #6ab0ff, #1a4fd0 60%, #0f2f8a); box-shadow: 0 0 0 2px var(--gold), 0 0 0 3px #000, 0 5px 8px rgba(0,0,0,.55);
  font: bold 24px/1 Arial, sans-serif; text-shadow: var(--ol); animation: bob 2.6s ease-in-out infinite; }
.slot:nth-child(2n) .pad b { animation-delay: -1.3s; } .slot:active .pad b { filter: brightness(1.25); }
@keyframes bob { 50% { transform: translateY(-4px); } }
.formation .hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 200; pointer-events: none; padding: 6px 14px; border-radius: 999px;
  background: rgba(0,0,0,.6); font-family: Rodin, Arial, sans-serif; font-size: 12.5px; text-shadow: var(--ol); white-space: nowrap; }
.slot .sl { position: absolute; bottom: -12px; font-family: Rodin, Arial, sans-serif; font-size: 10px; padding: 0 6px; border-radius: 4px; background: rgba(0,0,0,.65); text-shadow: var(--ol); white-space: nowrap; }
.slot .sl.lead { background: linear-gradient(#ffe38a, #c98a16); } .slot .sl.friend { background: linear-gradient(#7ad6ff, #1e8fe0); }
.mem { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--gold3); } .mem:first-child { border-top: 0; }
.mem img.ic { width: 44px; height: 44px; flex: none; cursor: pointer; } .mem .mn { flex: 1; min-width: 0; font-family: Rodin, Arial, sans-serif; font-size: 13px; text-shadow: var(--ol); cursor: pointer; }
.mem .mn small { display: block; font-family: Arial, sans-serif; font-size: 11px; color: var(--dim); }
.cov { display: grid; grid-template-columns: 1fr; gap: 0; }
.cov > div { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,.06); min-height: 36px; }
.cov .cl { width: 118px; flex: none; font-family: Rodin, Arial, sans-serif; font-size: 12px; text-shadow: var(--ol); }
.cov .ok { color: #7ad67a; } .cov .no { color: #ff8a7a; } .cov .cl small { color: var(--accent); font-size: 10.5px; }
.cov .who { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; } .cov .who img { width: 26px; height: 26px; }
.mu { display: grid; grid-template-columns: 96px repeat(6, 1fr); align-items: center; text-align: center; font-family: Rodin, Arial, sans-serif; font-size: 14px; text-shadow: var(--ol); }
.mu > div { padding: 5px 0; border-top: 1px solid rgba(255,255,255,.06); } .mu > div:nth-child(-n+7) { border-top: 0; }
.mut img { width: 18px; height: 18px; vertical-align: -4px; margin-right: 2px; } .mu .k { text-align: left; font-size: 11px; color: var(--orange); } .mu img { width: 26px; height: 26px; vertical-align: middle; filter: drop-shadow(0 1px 1px #000); }
.mu .best img { filter: drop-shadow(0 0 5px #7ad67a) drop-shadow(0 0 2px #7ad67a); } .mu .worst img { filter: drop-shadow(0 0 5px #ff6b6b) drop-shadow(0 0 2px #ff6b6b); } .mu .dim { opacity: .45; }
/* ＋ Team: which team */
.tlist { display: grid; gap: 8px; margin: 10px 0; text-align: left; }
.tpick { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--gold2); background: linear-gradient(#1c2340, #0b1024); }
.tpick.on { border-color: var(--accent); } .tpick:disabled { opacity: .45; }
.tpick b { flex: 1; min-width: 0; font-family: Rodin, Arial, sans-serif; font-weight: normal; font-size: 13.5px; text-shadow: var(--ol); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpick small { flex: none; font-size: 11px; color: var(--dim); } .tpick .ti { display: flex; flex: none; } .tpick .ti img, .tpick .ti i { width: 24px; height: 24px; margin-left: -4px; border-radius: 50%; }
.tpick .ti i { display: inline-block; border: 1px dashed rgba(255,255,255,.35); }
/* a tap shows: the app turns off the browser's own tap highlight */
.gu > img:first-child { transition: transform .1s; } .gu:active > img:first-child { transform: scale(.93); }
.lu:active, .item:active, .gate:active, .ni:active, .tpick:active { filter: brightness(1.25); } .eu:active img, .ichip:active { transform: scale(.94); }
.chip:active, .jump button:active, .tabs2 button:active, .iconbtn:active, .favbtn:active { transform: scale(.94); }
/* pages fade in */
#page > *, .view.on { animation: fadein .14s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { #page > *, .view.on, .slot .pad b { animation: none; } }

/* compare */
.cmpbar { position: fixed; right: 12px; bottom: calc(var(--navh) + 14px); z-index: 25; }
.cmp { display: grid; gap: 0; font-size: 12px; overflow-x: auto; }
.cmp .row { display: grid; grid-template-columns: 62px repeat(var(--n), minmax(96px, 1fr)); border-top: 1px solid rgba(255,255,255,.07); }
.cmp .row > div { padding: 6px 4px; } .cmp .k { color: var(--orange); font-family: Rodin, Arial, sans-serif; font-size: 10.5px; text-shadow: var(--ol); }
.cmp .num { font-family: Rodin, Arial, sans-serif; text-shadow: var(--ol); font-size: 13px; } .cmp .best { color: var(--accent); }
.cmp .hd { text-align: center; } .cmp .hd img { width: 18px; height: 18px; vertical-align: -4px; } .cmp .hd img.ic { width: 56px; height: 56px; cursor: pointer; } .cmp .hd b { display: block; font-family: Rodin, Arial, sans-serif; font-size: 11.5px; text-shadow: var(--ol); line-height: 1.2; }
.cmp .tx { color: #ece6d6; font-size: 11px; line-height: 1.35; }

/* start screen: the game's title art while the data loads */
#splash { position: fixed; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; transition: opacity .25s; }
#splash img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
#splash .sl { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); font-family: Rodin, Arial, sans-serif; font-size: 16px; text-shadow: var(--ol); animation: blink 1.2s infinite; }
#splash.gone { opacity: 0; pointer-events: none; }
@keyframes blink { 50% { opacity: .35; } }

/* pop-up */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; }
.mbox { max-width: 520px; width: 100%; max-height: 86vh; overflow: auto; border-radius: 12px; border: 2px solid var(--gold); background: linear-gradient(#141a2e, #070810); box-shadow: 0 6px 24px #000; padding: 12px; text-align: center; }
.mbox img { max-width: 100%; }
/* box editing, back to top, named teams, leader skills in the picker, numbers in skill text */
.nb { font-weight: bold; color: #ffdf8f; }
.editbar { position: fixed; left: 10px; right: 10px; bottom: calc(var(--navh) + 10px); z-index: 25; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 12px;
  border: 2px solid var(--gold); background: linear-gradient(#20305c, #0f1733); box-shadow: 0 4px 14px #000; }
.editbar div { flex: 1; min-width: 0; font-size: 12px; text-shadow: var(--ol); } .editbar b { display: block; font-family: Rodin, Arial, sans-serif; font-weight: normal; font-size: 14px; color: #9ff09f; }
body.boxedit main { padding-bottom: calc(var(--navh) + 90px); }
body.boxedit #v-units .gu:not(.got) > img:first-child, body.boxedit #v-units .lu:not(.got) > img { filter: grayscale(.85) brightness(.5); }
.totop { position: fixed; right: 12px; bottom: calc(var(--navh) + 14px); z-index: 25; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold2); background: rgba(10,16,32,.92); font-size: 15px; box-shadow: 0 2px 6px #000; }
#cmpbar:not([hidden]) ~ .totop { bottom: calc(var(--navh) + 64px); }
body.boxedit .totop { bottom: calc(var(--navh) + 78px); } body.boxedit .toast { bottom: calc(var(--navh) + 84px); }
.jump button.on { border-color: var(--accent); background: linear-gradient(#3f8cff, #1a4fd0 60%, #0f2f8a); }
.tabs2.teams { position: relative; overflow-x: auto; scrollbar-width: none; } .tabs2.teams::-webkit-scrollbar { display: none; }
.tabs2.teams button { flex: 1 0 auto; min-width: 78px; padding: 0 12px; white-space: nowrap; } .tabs2.teams .add { flex: 0 0 40px; min-width: 40px; padding: 0; font-size: 18px; }
.lsl { font-size: 11.5px; color: #9ff09f; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: var(--ol); }
.lsl b { color: var(--orange); font-family: Rodin, Arial, sans-serif; font-weight: normal; margin-right: 4px; }
.hero .art.zoom { cursor: zoom-in; }
@media (hover: hover) {
  .gu > img:first-child { transition: transform .12s; } .gu:hover > img:first-child { transform: translateY(-2px); }
  .lu:hover, .item:hover { border-color: var(--gold); } .gate:hover { background: rgba(255,255,255,.05); }
  .gbtn:hover:not(:disabled), .chip:hover, .jump button:hover { filter: brightness(1.15); }
}
/* on a PC screen: one centered column, like a big phone */
@media (min-width: 1000px) { main { max-width: 920px; margin: 0 auto; } .top { padding-left: calc(50vw - 460px); padding-right: calc(50vw - 460px); } }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); } .hero { min-height: 300px; } .list { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
/* a wide header: the picture under the glow (70% across), whole, instead of against the right edge and cut off */
@media (min-width: 700px) { .hero .art { right: auto; left: 70%; transform: translateX(-50%); max-width: 56%; object-position: center bottom; } .hero .art.icon { transform: translate(-50%, 50%); } }
</style>

<body>
<div id="splash"><img src="/static/title.jpg" alt=""><div class="sl">Loading…</div></div>
<header class="top">
  <button class="back" id="back" aria-label="Back">‹</button>
  <img class="crest" id="about" src="/static/logo.png" alt="About BF Companion" role="button" tabindex="0">
  <h1 id="title">Units</h1>
  <button class="iconbtn" id="favtab" title="Favorites" aria-label="Favorites"><img src="/static/star_fav.png" alt=""></button>
  <button class="iconbtn" id="viewmode" title="Grid or list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
  <button class="iconbtn" id="share" title="Share" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
</header>

<main>
  <section class="view on" id="v-units">
    <div class="bar2">
      <div class="searchrow"><input id="uq" type="search" placeholder="Name, skill or role…" autocomplete="off">
        <select id="usort"><option value="rarity">Rarity</option><option value="element">Element</option><option value="new">Newest</option><option value="name">Name</option><option value="atk">ATK</option><option value="hp">HP</option><option value="def">DEF</option><option value="rec">REC</option><option value="cost">Cost</option><option value="power">Strongest (role)</option></select>
        <button class="iconbtn fbtn" id="ufbtn" title="Filters" aria-label="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span id="ufn"></span></button></div>
      <div id="ufilters">
        <div class="scroller" id="uel"></div>
        <div class="scroller" id="urar"></div>
        <div class="scroller" id="urole" hidden></div>
        <div class="scroller" id="uget"></div>
      </div>
      <div class="fsum" id="usum" hidden></div>
    </div>
    <div class="count" id="ucount"></div>
    <div id="ulist"></div>
  </section>
  <section class="view" id="v-elgifs">
    <div class="bar2"><div class="searchrow"><input id="eq" type="search" placeholder="Search Elgifs: name, effect or where…" autocomplete="off"></div></div><div class="scroller wrap" id="echips"></div>
    <div class="count" id="ecount"></div><div id="elist" style="padding-top:10px"></div>
  </section>
  <section class="view" id="v-spheres">
    <div class="bar2"><div class="searchrow"><input id="sq" type="search" placeholder="Search spheres and items…" autocomplete="off"></div><div class="scroller" id="stype"></div></div>
    <div class="count" id="scount"></div><div id="slist" style="padding-top:10px"></div>
  </section>
  <section class="view" id="v-drops">
    <div class="sec" style="text-align:center"><img src="/static/home_win_quest.png" alt="" style="height:96px;filter:drop-shadow(0 4px 6px #000)">
      <p class="dim small" style="margin:6px 0 10px">Type an item or unit to see where to get it, or a quest, area or raid to see what drops and who joins there.</p>
      <input id="dq" type="search" placeholder="Blue Claw, Kagan Desert, RC7…" style="width:100%" autocomplete="off"></div>
    <div id="dres"></div>
  </section>
  <section class="view" id="v-favs"><div id="frecent"></div><div id="fbox"></div><div class="count" id="fcount"></div><div id="flist"></div></section>
  <section class="view" id="v-team"></section>
  <section id="page"></section>
</main>

<nav class="nav">
  <button data-tab="units" class="on" aria-label="Units"><img src="/static/nav_unit.png" alt=""></button>
  <button data-tab="elgifs" aria-label="Elgifs"><img src="/static/nav_elgif.png" alt=""></button>
  <button data-tab="spheres" aria-label="Spheres and items"><img src="/static/nav_item.png" alt=""></button>
  <button data-tab="drops" aria-label="Drops"><img src="/static/nav_quest.png" alt=""></button>
  <button data-tab="team" aria-label="Team builder"><img src="/static/nav_team.png" alt=""></button>
</nav>
<button class="gbtn blue cmpbar" id="cmpbar" hidden></button>
<div class="editbar" id="editbar" hidden><div><b>Editing your box</b>Tap the units you have · <span id="ebn">0</span> in your box</div><button class="gbtn green" id="ebdone">Done</button></div>
<button class="totop" id="totop" hidden aria-label="Back to top">▲</button>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
// the start screen goes once the app is ready, or after 4 s whatever happens
const hideSplash = () => { const s = $("splash"); if (s && !s.classList.contains("gone")) { s.classList.add("gone"); setTimeout(() => s.remove(), 260); } };
setTimeout(hideSplash, 4000);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ELS = ["Fire", "Water", "Earth", "Thunder", "Light", "Dark"];
const orb = e => e ? `<img src="/static/orb_${e}.png" alt="">` : "";
// the game's own stars: rarity (orange) and favorite (yellow)
const STAR = `<img class="sti" src="/static/star.png" alt="★">`, FAVSTAR = `<img class="sti" src="/static/star_fav.png" alt="★">`;
// the game's purple star: an Elgif's rarity, and the stars on an Imbued Tablet Elgif
const ESTAR = `<img class="sti" src="/static/star_elgif.png" alt="★">`, starFor = u => u.id === "50792" ? ESTAR : STAR;
const OMNI = `<img class="sti omi" src="/static/omni.png" alt="">`;  // the game's Omni rarity mark
const SEX = { M: ["m", "Male"], F: ["f", "Female"] };
const uImg = id => `/thumbs/u/${id}.webp`, iImg = id => `/thumbs/i/${id}.webp`, aImg = id => `/thumbs/a/${id}.webp`;
const sImg = id => `/thumbs/s/${id}.webp`;  // the game's animated battle sprite (idle loop)
// "no-cache": ask for the newest copy every time (the PC guide's server lets a browser keep files for an hour, so an
// update could show old data); unchanged files come back as a quick "not modified"
const DB = {}, load = n => DB[n] ??= fetch(`/data/${n}.json`, { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const wiki = id => load(`w/${id}`);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function toast(m) { $("toast").textContent = m; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 1800); }
// numbers and dates look the same on every phone, whatever its language: "25,330", "31 October 2026"
const fmt = n => n.toLocaleString("en");
const day = t => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
// skill and sphere text with its numbers picked out: "<b>150%</b> boost to Atk for <b>3</b> turns"
const hl = t => esc(t).replace(/\d+(?:[.,]\d+)?(?:\s*[~-]\s*\d+(?:[.,]\d+)?)?%?/g, m => `<b class="nb">${m}</b>`);
// the chance to get a unit at least once in 10 pulls of p% each
const in10 = p => { const v = 100 * (1 - (1 - p / 100) ** 10); return v >= 99.95 ? ">99.9" : v < .1 ? "<0.1" : v < 10 ? v.toFixed(1) : Math.round(v); };
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function modal(html) { $("mbox").innerHTML = html; $("modal").hidden = false; }
$("modal").onclick = e => { if (e.target.id === "modal" || e.target.closest(".mclose")) $("modal").hidden = true; };
// tap the logo: version, how fresh the data is, where it comes from, where new versions are
async function showAbout() {
  const [V, S, U, I, C] = await Promise.all([load("version"), load("usrc"), load("units"), load("items"), load("changelog")]);
  const log = Array.isArray(C) ? C : [], notes = e => `<ul>${(e.notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
  const url = "https://github.com/Nervequakes/BF-Companion/releases";
  modal(`<div class="about"><img src="/static/logo.png" alt="" style="height:64px"><div class="big">BF Companion</div>
    <p class="dim">${V.version ? `Version ${esc(V.version)}${V.built ? ` · built ${day(V.built)}` : ""}` : "Offline guide for Brave Frontier Revived"}</p>
    <div class="facts"><div><b>${Object.keys(U).length.toLocaleString("en")}</b>units</div><div><b>${Object.values(I).filter(s => s.name).length.toLocaleString("en")}</b>spheres & items</div><div><b>${Object.keys(S.g || {}).length}</b>summon gates</div></div>
    ${S.built ? `<p>Revived's drop, capture and summon data from <b>${day(S.built * 1000)}</b>.</p>` : ""}
    ${log.length ? `<div class="news"><b>What's new in ${esc(log[0].version)}</b>${notes(log[0])}${log.length > 1 ? `<details><summary>Earlier versions</summary>${
      log.slice(1).map(e => `<p class="small" style="margin:8px 0 0"><b>${esc(e.version)}</b>${e.date ? ` · ${day(e.date)}` : ""}</p>${notes(e)}`).join("")}</details>` : ""}</div>` : ""}
    <p class="small">Your box: <b>${mine.size}</b> units · Favorites: <b>${favs.size}</b></p>
    <p class="dim small">Data from the game's own files, <b>bfrevive.net</b> and the Brave Frontier Wiki. No internet, no account, nothing collected. Fan-made: not affiliated with gumi or the BF Revive team.</p>
    <p class="small">New versions: <b>github.com/Nervequakes/BF-Companion</b></p>
    <div class="btnrow" style="justify-content:center"><button class="gbtn blue" id="copylink">Copy link</button><button class="gbtn mclose">Close</button></div></div>`);
  $("copylink").onclick = () => { window.BFApp ? BFApp.copyText(url) : navigator.clipboard?.writeText(url); toast("Link copied: open it in your browser"); };
}
$("about").onclick = showAbout;
const elementChart = () => modal(`<img src="/static/elements.png" alt="Element correlation"><div class="btnrow" style="justify-content:center"><button class="gbtn mclose">Close</button></div>`);

try { localStorage.removeItem("bf.box"); } catch {}  // a box imported in version 4.0–4.3 (the import is gone)

// ---------------- roles (tags.json) and skill text search ----------------
let TAGS = { labels: {}, units: {}, power: {}, powerUnit: {} };
const roleOf = (id, code, leaderToo) => { const s = TAGS.units[id]?.[code] || ""; return leaderToo ? !!s : /[EBSU]/.test(s); };
const SKILL_NAMES = { L: "LS", E: "ES", B: "BB", S: "SBB", U: "UBB" };
// how strong a role is on the unit's BB/SBB: [value, skill letter], e.g. mitigation [50, "B"]
const powerOf = (id, c) => TAGS.power[id]?.[c];
const fmtPower = (c, p) => !p ? "" : c === "heal" && p[0] >= 10000 ? "full heal" : `${p[0].toLocaleString("en")}${TAGS.powerUnit[c] || ""}`;
let POWER_MAX = {};  // strongest value per role, to weigh roles against each other
const rolePills = id => Object.entries(TAGS.units[id] || {}).map(([c, s]) => { const p = powerOf(id, c);
  return `<span class="role">${esc(TAGS.labels[c] || c)}${p ? ` <b>${fmtPower(c, p)}</b>` : ""}<small>${[...new Set(s)].map(k => SKILL_NAMES[k]).join(" ")}</small></span>`; }).join("");
// the role a list is about: the first role filter, or a role named in the search
const activeRole = () => [...uState.roles][0] || (uState.q.trim() ? parseQuery(uState.q.trim().toLowerCase()).roles[0] : undefined);
const byPower = c => (a, b) => (powerOf(b.id, c)?.[0] || 0) - (powerOf(a.id, c)?.[0] || 0) || b.r - a.r || b.no - a.no;
const powerTag = (u, c) => { const p = c && powerOf(u.id, c); return p ? `<span class="pwtag">${fmtPower(c, p)}</span>` : ""; };
let SKTXT = null;
async function skillText() {
  if (SKTXT) return SKTXT;
  const D = await load("details"); SKTXT = {};
  for (const [id, d] of Object.entries(D)) SKTXT[id] = [d.leader?.name, d.leader?.desc, d.extra, ...(d.skills || []).flatMap(s => [s.name, s.desc])].join(" ").toLowerCase();
  return SKTXT;
}

// ---------------- units ----------------
let UNITS = [], UMAP = {};
const FODDER = /^((fire|water|earth|thunder|light|dark) (crystal|god|idol|nymph|spirit|totem|jewel|sprite|elemental)|metal (king|ghost|mimic|totem|god)|(dragon |king )?mimic|gs-220|.*burny|.*bulb|sphere frog|.*imp)$/i;
const RARITY = [["omni", `${OMNI}Omni`, u => u.r === 8], ["7", `7${STAR}`, u => u.r === 7], ["6", `6${STAR}`, u => u.r === 6], ["5", `5${STAR}`, u => u.r === 5], ["low", `4${STAR} and below`, u => u.r < 5]];
let uState = { els: new Set(ELS), rar: new Set(["omni", "7", "6"]), q: "", sort: "rarity", roles: [], get: [], showRoles: false, mine: false, ...store.get("bf.units", {}) };
uState.els = new Set(uState.els); uState.rar = new Set(uState.rar); uState.roles = new Set(uState.roles); uState.get = new Set(uState.get);
delete uState.mine; if (uState.sort === "lv") uState.sort = "rarity";  // box filter and sort from 4.0–4.3
let viewMode = store.get("bf.view", "grid"), favs = new Set(store.get("bf.favs", []));
// "My box": the units you have, marked by hand on their page (kept only on this phone)
let mine = new Set(store.get("bf.mine", []));
const saveMine = () => store.set("bf.mine", [...mine]);
let RECENT = store.get("bf.recent", []);  // [["u" | "i", id], ...] opened last, newest first
function remember(t, id) { RECENT = [[t, id], ...RECENT.filter(([a, b]) => !(a === t && b === id))].slice(0, 16); store.set("bf.recent", RECENT); }
function saveU() { store.set("bf.units", { ...uState, els: [...uState.els], rar: [...uState.rar], roles: [...uState.roles], get: [...uState.get] }); }
// ways to get a unit in Revived right now (bfrevive.net, usrc.json): c = capture, g = summon gate, r = clear reward, s = event shop
let USRC = null;
const GETS = [["w", "This week"], ["g", "Summon"], ["c", "Capture"], ["rs", "Reward / shop"]];
// the featured summon gate a unit is in this week (bit 1 of the gate's flags), if any: [gate id, % per pull]
const weekGate = id => (USRC?.u?.[id]?.g || []).find(([g]) => USRC.g[g]?.[1] & 1);
const hasSrc = id => { const s = USRC?.u?.[id]; return !!s && [...uState.get].some(k => k === "w" ? weekGate(id) : k === "rs" ? s.r || s.s : s[k]); };

function unitBadges(u) {
  return `${u.r === 8 ? `<span class="badge star">${OMNI}OMNI</span>` : `<span class="badge star">${u.r}${starFor(u)}</span>`}${u.e ? `<span class="badge">${orb(u.e)}${u.e}</span>` : ""}${u.c ? `<span class="badge cost">COST ${u.c}</span>` : ""}`;
}
// a unit drawn in a list keeps how to draw itself again, so its ★ and ✓ can change without drawing the whole list
const markSig = id => `${favs.has(id)}/${mine.has(id)}`;
function marked(d, u, redraw) { d.dataset.id = u.id; d.redraw = redraw; d.sig = markSig(u.id); d.classList.toggle("got", mine.has(u.id)); return d; }
const refreshMarks = root => root.querySelectorAll("[data-id]").forEach(d => d.redraw && d.sig !== markSig(d.dataset.id) && d.replaceWith(d.redraw()));
// "Edit box": tapping units in the list marks them as yours (or not), one after another
let boxEdit = false;
function setBoxEdit(on) {
  boxEdit = on; document.body.classList.toggle("boxedit", on); $("editbar").hidden = !on; $("ebn").textContent = mine.size;
  $("uedit")?.classList.toggle("on", on); updateCmpBar(); onScrollTop();
  // editing needs every unit in the list, not only the ones already in the box
  if (on && uState.mine) { uState.mine = false; $("umine")?.classList.remove("on"); renderUnits(); }
}
function tapUnit(u, d, onTap) {
  if (onTap) return onTap(u);
  if (!boxEdit) return go(`#/unit/${u.id}`);
  mine.has(u.id) ? mine.delete(u.id) : mine.add(u.id); saveMine();
  d.replaceWith(d.redraw()); $("ebn").textContent = mine.size;
}
function gridCell(u, onTap, role) {
  const d = document.createElement("div"); d.className = "gu"; d.onclick = () => tapUnit(u, d, onTap);
  d.innerHTML = `<img loading="lazy" decoding="async" src="${uImg(u.id)}" alt="" onerror="this.style.visibility='hidden'">${favs.has(u.id) ? `<img class="fav" src="/static/star_fav.png" alt="★">` : ""}${mine.has(u.id) ? `<span class="own ${favs.has(u.id) ? "f" : ""}" title="In my box">✓</span>` : ""}${powerTag(u, role)}<div class="gname">${esc(u.n)}</div>`;
  return marked(d, u, () => gridCell(u, onTap, role));
}
function listRow(u, onTap, role) {
  const d = document.createElement("div"); d.className = "lu"; d.onclick = () => tapUnit(u, d, onTap);
  if (u.e) d.style.setProperty("--el", `var(--${u.e})`);
  const p = role && powerOf(u.id, role);
  d.innerHTML = `<img loading="lazy" decoding="async" src="${uImg(u.id)}" alt="" onerror="this.style.visibility='hidden'"><div style="min-width:0;flex:1">
    <div class="ln">${favs.has(u.id) ? FAVSTAR + " " : ""}${esc(u.n)}</div><div class="badges">${unitBadges(u)}${mine.has(u.id) ? `<span class="badge own">✓ My box</span>` : ""}${p ? `<span class="badge pw">${esc(TAGS.labels[role])} ${fmtPower(role, p)} · ${SKILL_NAMES[p[1]]}</span>` : ""}</div>
    <div class="ls"><div><span>HP</span>${fmt(u.hp)}</div><div><span>ATK</span>${fmt(u.atk)}</div><div><span>DEF</span>${fmt(u.def)}</div><div><span>REC</span>${fmt(u.rec)}</div></div></div>`;
  return marked(d, u, () => listRow(u, onTap, role));
}
// lists draw in batches as you scroll: thousands of icons at once is slow on a phone
let NAV_LIST = [];  // ids of the unit list shown last, for previous / next on a unit page
function paged(container, items, make, cls) {
  const box = document.createElement("div"); box.className = cls; container.replaceChildren(box);
  const more = document.createElement("div"); more.className = "more"; more.textContent = "…";
  let n = 0; const per = cls === "grid" ? 96 : 40;
  const step = () => { const next = items.slice(n, n + per); n += next.length; box.append(...next.map(make)); if (n < items.length) container.append(more); else more.remove(); };
  step();
  new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { more.remove(); step(); if (n >= items.length) ob.disconnect(); } }, { rootMargin: "1200px" }).observe(more);
}
const elOrder = u => (ELS.indexOf(u.e) + 1) || 9;  // Fire, Water, Earth, Thunder, Light, Dark, then units without one
const SORTS = { rarity: (a, b) => b.r - a.r || b.no - a.no, element: (a, b) => elOrder(a) - elOrder(b) || b.r - a.r || b.no - a.no, new: (a, b) => b.no - a.no || b.r - a.r, name: (a, b) => a.n.localeCompare(b.n),
  atk: (a, b) => b.atk - a.atk, hp: (a, b) => b.hp - a.hp, def: (a, b) => b.def - a.def, rec: (a, b) => b.rec - a.rec, cost: (a, b) => b.c - a.c || b.r - a.r };
// one word or phrase: the name, or (3+ letters) the skill text or a role ("spark", "def ignore", "mitigation")
const phraseHit = (u, q) => q.length >= 3 && (!!SKTXT?.[u.id]?.includes(q) || Object.entries(TAGS.labels).some(([c, l]) => l.toLowerCase().includes(q) && TAGS.units[u.id]?.[c]));

    const r = R[iid];

    karma += r[0] * n;
    return { id: iid, n, kids: r[1].map(([m, c]) => node(m, c * n, depth + 1)) };

// the team as a picture to share: the squad on the battle field, the members and the leader skills
async function shareTeam(team, W) {
  toast("Drawing the picture…");
  const S = 2, WD = 720, FH = 440, D = await load("details");
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  await document.fonts.load("20px Rodin").catch(() => {});
  const ids = team.map(id => id && UMAP[id] ? id : null);
  const [bg, ...sprs] = await Promise.all([loadImg("/static/battle_bg.jpg"), ...ids.map(id => id ? loadImg(sImg(id)) : null)]);
  const icons = await Promise.all(ids.map(id => id ? loadImg(uImg(id)) : null));
  const lss = [0, 5].filter(i => ids[i]).map(i => {
    const s = (W[i]?.skills || []).find(s => s.kind === "Leader Skill");
    return [i ? "Friend" : "Leader", s?.name || D[ids[i]]?.leader?.name || "", s?.desc || D[ids[i]]?.leader?.desc || ""];
  });
  const members = ids.map((id, i) => [id, i]).filter(([id]) => id), rows = Math.ceil(members.length / 2);
  // word-wrapped lines of a text, measured before the canvas exists so the picture is exactly as tall as it needs
  const lines = (ctx, text, maxw, px) => { ctx.font = `${px}px Arial`; const out = []; let line = "";
    for (const w of String(text).split(" ")) { if (ctx.measureText(line + w).width > maxw && line) { out.push(line); line = ""; } line += w + " "; }
    return [...out, line]; };
  const probe = document.createElement("canvas").getContext("2d");
  const lsH = lss.reduce((a, [, , desc]) => a + 36 + lines(probe, desc, WD - 40, 14).length * 18.2, 0);
  const H = Math.ceil(FH + 74 + rows * 88 + lsH + 44);
  const cv = document.createElement("canvas"); cv.width = WD * S; cv.height = H * S;
  const g = cv.getContext("2d"); g.scale(S, S);
  const ot = (t, x, y, px, fill = "#fff", maxw) => { g.font = `${px}px Rodin, Arial`; g.lineJoin = "round"; g.lineWidth = Math.max(3, px * .18); g.strokeStyle = "#000"; g.strokeText(t, x, y, maxw); g.fillStyle = fill; g.fillText(t, x, y, maxw); };
  const wrap = (text, x, y, maxw, px, color) => { g.fillStyle = color; for (const l of lines(g, text, maxw, px)) { g.fillText(l, x, y); y += px * 1.3; } return y; };
  g.fillStyle = "#0b0a14"; g.fillRect(0, 0, WD, H);
  if (bg) { const k = Math.max(WD / bg.width, FH / bg.height); g.drawImage(bg, (WD - bg.width * k) / 2, (FH - bg.height * k) * .6, bg.width * k, bg.height * k); }
  // the squad, back rows first so the front ones stand in front
  const feet = i => [SPOS[i][0] / 100 * WD, 60 + SPOS[i][1] / 100 * (FH - 80)];
  [0, 1, 2, 3, 4, 5].sort((a, b) => SPOS[a][1] - SPOS[b][1]).forEach(i => {
    const im = sprs[i] || icons[i]; if (!im) return;
    const k = Math.min(1.8, 160 / im.width, 110 / im.height), w = im.width * k, h = im.height * k, [x, y] = feet(i);
    g.imageSmoothingEnabled = k < 1; g.drawImage(im, x - w / 2, y - h, w, h); g.imageSmoothingEnabled = true;
  });
  for (const i of [0, 5]) if (ids[i]) { const [x, y] = feet(i); ot(i ? "Friend" : "Leader", x - 28, y + 14, 15, i ? "#7ad6ff" : col("--accent")); }
  g.fillStyle = col("--gold"); g.fillRect(0, FH, WD, 3);
  const cost = ids.slice(0, 5).reduce((a, id) => a + (UMAP[id]?.c || 0), 0);
  ot(teamName(TCUR), 20, FH + 42, 28, "#fff", WD - 200); ot(`Cost ${cost}`, WD - 150, FH + 42, 20, col("--orange"));
  const I = await load("items");
  members.forEach(([id, i], n) => {
    const u = UMAP[id], x = 20 + (n % 2) * 350, y = FH + 64 + Math.floor(n / 2) * 88, N = unitNumbers(i, ids, W, D, I);
    if (icons[i]) g.drawImage(icons[i], x, y, 64, 64);
    ot(u.n, x + 74, y + 20, 16, "#fff", 262);
    g.font = "12px Arial"; g.fillStyle = col("--dim");
    g.fillText(`${SLOTS[i]} · Lv.${N.lv} · ${u.r === 8 ? "Omni" : u.r + "★"} ${u.e || ""} · Cost ${u.c || "?"}`, x + 74, y + 40, 262);
    ot(`HP ${N.s[0].toLocaleString("en")}  ATK ${N.s[1].toLocaleString("en")}`, x + 74, y + 58, 13, col("--accent"), 262);
    ot(`DEF ${N.s[2].toLocaleString("en")}  REC ${N.s[3].toLocaleString("en")}`, x + 74, y + 75, 13, col("--accent"), 262);
  });
  let y = FH + 74 + rows * 88 + 10;
  for (const [label, name, desc] of lss) { ot(`${label} · ${name}`, 20, y, 17, col("--accent"), WD - 40); y = wrap(desc, 20, y + 24, WD - 40, 14, "#ece6d6") + 12; }
  ot("BF Companion", WD - 170, H - 14, 14, col("--dim"));
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(blob); });
  if (window.BFApp) BFApp.shareImage(b64, `BF ${teamName(TCUR).replace(/[^\w -]+/g, "")}.png`, true);
  else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `BF ${teamName(TCUR).replace(/[^\w -]+/g, "")}.png`; a.click(); }
}

  $("modal").hidden = true; updateCmpBar();
  if ((m = h.match(/^#\/unit\/(\d+)/))) return showUnit(m[1]);
  if ((m = h.match(/^#\/item\/(\d+)/))) return showItem(m[1]);
  if ((m = h.match(/^#\/pick\/(\d)(?:\?role=(\w+))?/))) return showPick(+m[1], m[2]);
  if ((m = h.match(/^#\/sphere\/(\d)\/(\d)/))) return showSpherePick(+m[1], +m[2]);
  if ((m = h.match(/^#\/gate\/(\d+)/))) return showGate(m[1]);
  if (h === "#/compare") return showCompare();
  const t = (h.match(/^#\/(\w+)/) || [])[1];
  tab = TABS[t] ? t : "units";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + tab));
  refreshMarks($("v-" + tab));  // ★ and ✓ changed on a unit page
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("favtab").classList.toggle("on", tab === "favs");
  setTitle(TABS[tab], false);
  if (tab === "favs") renderFavs();
  else if (tab === "team") renderTeam();
  else if (!tabsDrawn.has(tab)) { tabsDrawn.add(tab); if (tab === "units") renderUnits(); if (tab === "spheres") renderSpheres(); if (tab === "drops") renderDrops(); if (tab === "elgifs") renderElgifs(); }
  requestAnimationFrame(() => window.scrollTo(0, scrollPos[tab] || 0));
}
addEventListener("scroll", () => { if (!document.body.classList.contains("sub")) scrollPos[tab] = scrollY; }, { passive: true });
// ▲ back to the top of a long list or page
function onScrollTop() { $("totop").hidden = scrollY < 1500; }
addEventListener("scroll", onScrollTop, { passive: true });
$("totop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
// Enter in a search box closes the keyboard, so the results can be seen
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches?.("input[type=search]")) e.target.blur(); });
$("ebdone").onclick = () => { setBoxEdit(false); toast(`${mine.size} unit${mine.size === 1 ? "" : "s"} in your box`); };
addEventListener("hashchange", route);
// tapping the tab you're on goes back to the top of its list
document.querySelectorAll(".nav button").forEach(b => b.onclick = () =>
  b.dataset.tab === tab && !document.body.classList.contains("sub") ? window.scrollTo({ top: 0, behavior: "smooth" }) : go(`#/${b.dataset.tab}`));
// sideways chip rows: a fade on the side where more chips are hidden, and the mouse wheel scrolls them sideways
const scrollHint = el => { const max = el.scrollWidth - el.clientWidth;
  el.classList.toggle("less", el.scrollLeft > 2); el.classList.toggle("more", max > 2 && el.scrollLeft < max - 2); };
const scrollHints = () => document.querySelectorAll(".scroller:not(.wrap)").forEach(scrollHint);
document.addEventListener("scroll", e => e.target.classList?.contains("scroller") && scrollHint(e.target), true);  // scroll doesn't bubble
document.addEventListener("wheel", e => {
  const el = e.target.closest?.(".scroller:not(.wrap)"), x = el?.scrollLeft;
  if (el && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; if (el.scrollLeft !== x) e.preventDefault(); }  // at its ends the page scrolls
}, { passive: false });
let hintRaf = 0;
new MutationObserver(() => { cancelAnimationFrame(hintRaf); hintRaf = requestAnimationFrame(scrollHints); }).observe(document.body, { childList: true, subtree: true });
addEventListener("resize", scrollHints);
// swipe left / right on a unit page for the next / previous unit (not when scrolling a row sideways)
let swipe = null;
$("page").addEventListener("touchstart", e => {
  swipe = location.hash.startsWith("#/unit/") && !e.target.closest(".jump, .evo, .recent, .scroller, .cmp, .mats") ? [e.touches[0].clientX, e.touches[0].clientY] : null;
}, { passive: true });
$("page").addEventListener("touchend", e => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe[0], dy = e.changedTouches[0].clientY - swipe[1]; swipe = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) $(dx < 0 ? "unext" : "uprev")?.click();
}, { passive: true });
$("favtab").onclick = () => go(tab === "favs" ? "#/units" : "#/favs");
$("back").onclick = () => history.back();
$("viewmode").onclick = () => { viewMode = viewMode === "grid" ? "list" : "grid"; store.set("bf.view", viewMode); tab === "favs" ? renderFavs() : renderUnits(); };
let st; $("sq").oninput = () => { clearTimeout(st); st = setTimeout(renderSpheres, 80); };
let et; $("eq").oninput = () => { clearTimeout(et); et = setTimeout(renderElgifs, 80); };
let dt; $("dq").oninput = () => { clearTimeout(dt); dt = setTimeout(renderDrops, 120); };
$("dq").onchange = saveDropSearch;  // Enter or closing the keyboard keeps the search in "Recent searches"
$("dres").addEventListener("click", e => { if (e.target.closest(".ichip, .item")) saveDropSearch(); });
// Android back button (MainActivity calls this): leave a page, else let the app close
window.BFBack = () => {
  if (!$("modal").hidden) { $("modal").hidden = true; return true; }
  if (document.body.classList.contains("sub") || (location.hash && location.hash !== "#/units")) { history.back(); return true; }
  return false;
};

(async () => {
  const [U, T] = await Promise.all([load("units"), load("tags")]);
  TAGS = { labels: {}, units: {}, power: {}, powerUnit: {}, ...T };
  for (const p of Object.values(TAGS.power)) for (const [c, [v]] of Object.entries(p)) POWER_MAX[c] = Math.max(POWER_MAX[c] || 0, c === "heal" ? Math.min(v, 10000) : v);
  UNITS = Object.entries(U).map(([id, [n, r, e, c, h1, a1, d1, r1, hm, am, dm, rm, no]]) =>
    ({ id, n, r, e, c, h1, a1, d1, r1, hp: hm || h1, atk: am || a1, def: dm || d1, rec: rm || r1, no: no || 0, f: r <= 5 && FODDER.test(n) }));
  UMAP = Object.fromEntries(UNITS.map(u => [u.id, u]));
  setupUnitFilters();
  try { await route(); } finally { hideSplash(); }
  load("version").then(V => {
    const seen = store.get("bf.seenv", null), used = ["bf.recent", "bf.favs", "bf.teams"].some(k => store.get(k, null) !== null);
    if (!V.version || seen === V.version) return;
    store.set("bf.seenv", V.version);
    if (seen || used) setTimeout(showAbout, 600);
  });
  // read the big files while nothing happens, so the first unit, item or search opens at once
  const idle = window.requestIdleCallback || (f => setTimeout(f, 800));
  idle(() => {
    fmt(1000); day(0);  // number and date formatting are slow the first time: not on the first unit opened
    ["details", "items", "usrc", "drops"].reduce((p, n) => p.then(() => load(n)), Promise.resolve());
  });
})();
</script>
