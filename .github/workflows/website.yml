# The website (bfcompanion.app, GitHub Pages): built from the newest release, so it always matches the app.
# The page and everything it uses come out of the release's APK (assets/www); nothing else is needed.
# Started from main after every release by the publish step (auto_update.rebuild_website), since github-pages
# deploys only from main; or by hand: Actions > Website > Run workflow.
name: Website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: pages
        uses: actions/configure-pages@v5
      - name: Take the site out of the newest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern BF-Companion.apk
          unzip -q BF-Companion.apk 'assets/www/*'
          mv assets/www site
          test -f site/index.html -a -f site/data/units.json
      - name: Sharper artwork, banners and unit icons for the website (the site-pictures prerelease; without it, the APK's)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download site-pictures --repo "$GITHUB_REPOSITORY" --pattern site-pictures.zip; then
            unzip -q -o site-pictures.zip -d site/thumbs
            echo "artwork: $(ls site/thumbs/ahd | wc -l) · banners: $(ls site/thumbs/bhd | wc -l)"
            # the sharp icons (204 px, made from the artwork) take the place of the APK's 102 px ones: the page shows
            # icons at a set size, so it needs no change; units without one keep theirs
            if [ -d site/thumbs/uhd ]; then
              cp -f site/thumbs/uhd/*.webp site/thumbs/u/ && echo "sharp icons: $(ls site/thumbs/uhd | wc -l)"
              rm -rf site/thumbs/uhd
            fi
          else
            echo "no site-pictures release: the APK's pictures only"
          fi
      - name: Link previews (Discord, WhatsApp, X) with the site's own address
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'EOF'
          import os
          base = os.environ["BASE"].rstrip("/")
          desc = "A guide to Brave Frontier Revived: every unit's stats, skills and SP builds, where to get units, spheres and items, Elgifs, quest drops and a team builder."
          tags = "".join(f'<meta property="{k}" content="{v}">\n' for k, v in (
              ("og:type", "website"), ("og:site_name", "BF Companion"), ("og:title", "BF Companion"), ("og:description", desc),
              ("og:url", base + "/"), ("og:image", base + "/static/icon-512.png"))) + '<meta name="twitter:card" content="summary">\n'
          p = "site/index.html"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(t.replace("</title>\n", "</title>\n" + tags, 1))
          EOF
          grep -c 'og:image' site/index.html
      - name: Visit counter (GoatCounter), the website only and never the app, when the GOATCOUNTER variable names one
        env:
          GC: ${{ vars.GOATCOUNTER }}
        run: |
          if [ -n "$GC" ]; then
            python3 - <<'EOF' || echo "::warning::The visit counter wasn't added (GOATCOUNTER should be the code in <code>.goatcounter.com)"
          import os, re
          code = os.environ["GC"].strip()
          assert re.fullmatch(r"[a-z0-9-]+", code), code
          tag = f'<script data-goatcounter="https://{code}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>\n'
          p = "site/index.html"
          t = open(p, encoding="utf-8").read()
          assert t.count("</head>") == 1 and "<script data-goatcounter=" not in t
          open(p, "w", encoding="utf-8").write(t.replace("</head>", tag + "</head>", 1))
          EOF
            grep -c '<script data-goatcounter=' site/index.html || true
          else
            echo "no visit counter: the GOATCOUNTER variable isn't set"
          fi
      - name: A page per unit for shared links (bfcompanion.app/u/<id>), with the unit in the link preview
        run: python3 .github/unit_pages.py site "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
